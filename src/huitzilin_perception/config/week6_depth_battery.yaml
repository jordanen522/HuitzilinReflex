# Synthetic-depth battery for week6_synthetic_depth.launch.py — the 20 m/s
# question asked through the real detector. Every row assumes /threat/centroid
# is computed by the unmodified detector_node.py from a PointCloud2 on
# /oak/points published by synthetic_depth_publisher_node.py. Never run it under
# week6_oracle.launch.py, which asserts the centroid from Gazebo truth and
# shares no clustering code, and never with both stacks up: two publishers on
# /threat/centroid give the tracker two uncorrelated views of one ball.
#
# The cloud is synthetic — derived from Gazebo truth by a model of an
# AR0234-class global-shutter mono + 10 mm M12 stereo pair, because an 80 mm
# ball at 26 m subtends 0.176 deg and is sub-pixel at this world's 640x480 over
# 67.3 deg. What is real here is who COMPUTES the detection: ROI gate, voxel
# downsample, background differencing, clustering, extent test and centroid
# extraction are the shipped code running on real points. A number from this
# file is evidence about that pipeline, never that a rendered or physical depth
# sensor sees this far.
#
# A sensor is reach AND sector AND rate, and all three are inputs here — naming
# only detection_range_m describes a third instrument that is neither the one
# launched nor the one being compared against, which is what cost the first
# fidelity gate. Quote all of: detection_range_m (launch argument, default
# 26.0), fov_half_h/v_deg (sensor params, ±13.5 x 11.0), image_width/height, and
# the DELIVERED rate the publisher logs at startup — 60/ceil(60/requested).
# All are read once in the publisher's __init__ with no parameter callback, so
# `ros2 param set` is ignored and every change needs a full stack restart; the
# two scalars must be floats, since `detection_range_m:=26` parses as int and is
# rejected. 60 Hz also sets a slow-ball floor through frame differencing:
# v_min = diff_threshold_m * rate = 0.10 * 60 = 6.0 m/s, below which nothing is
# detected at any range, silently. Every row here is 8 m/s or above.
#
# No false-positive number lives here: the cloud contains the ball and nothing
# else, so background differencing runs but rejects nothing. Week 4's B07 (0/12
# false dodges at 8 m/s) remains the only measurement of that, and D10 is not a
# substitute — see its own note.
#
# Order of operations:
#   1. Fidelity gate, D11/D12 on patrol, with the modelled sensor pinned to the
#      OAK-D Lite Week 4 actually flew on all three axes:
#
#        ros2 launch huitzilin_perception week6_synthetic_depth.launch.py \
#            with_patrol:=true detection_range_m:=3.4 sensor_rate_hz:=15.0 \
#            sensor_params:=$(ros2 pkg prefix huitzilin_perception)/share/\
#      huitzilin_perception/params/synthetic_depth_oakd_gate.yaml
#
#      The launch file overrides detection_range_m and rate_hz from its own
#      arguments, so the command must carry them even though the gate params
#      file sets them too. Pinning reach alone does not reproduce Week 4: at
#      60 Hz D11 over-fires 4/6, at 15 Hz with the narrow lens D12 collapses to
#      0/6, and only the fully matched sensor returns D11 2/6 and D12 6/6.
#      Confirm D11 reproduces the 0/17 shape at 14 m/s and D12 the 78/78 shape
#      at 8 m/s. Score the gate on `dodged`, not on the counterfactual — the
#      Week 4 reference is itself a patrol dodge count — and never blend those
#      counts with the save rates below. Until the gate reproduces what is
#      already known, nothing this file says about 20 m/s is worth reading.
#   2. Only then run at full range, in hover, and read D08-D10.
#   3. Check `first_det_range_m` against the launched detection_range_m; they
#      must agree to ~0.2 m. If delivered reach is short the row measured a
#      shorter sensor than it claims — fix the offset and re-fly, do not report.
#   4. Score D08/D09 on the counterfactual per docs/RESULTS.md §10, never on
#      `dodged`. `counterfactual_min_m` is not a dodge_battery column: it comes
#      from scripts/hz_counterfactual.py, a passive scorer that must already be
#      running when the battery throws and cannot be recovered afterwards from
#      the battery CSV. Start it first, then join on `scenario` and `rep`:
#
#        python3 scripts/hz_counterfactual.py --out /tmp/week6_depth_cf.csv &
#
# Hover is required for D08-D10 — under patrol 0 of 98 throws have arrived
# inside 0.109 m, in hover 40/40 did — and it also drops the straight-leg
# requirement that made ranges >= 18 m unmeasurable:
#
#     EXTRA_ARGS="-p hover_mode:=true" ./scripts/run_dodge_battery.sh week6depth
#
# Offset rule: offset_forward_m must clear the sensor gate by a margin, or the
# ball is already inside the gate when the sensor first reports and the cell
# silently delivers less reach than it configures. Ball travel during
# spawn_dead_s, drone closure over the dead time plus one frame, and one frame
# of ball travel together eat ~8.5 m at 20 m/s and 14.5 Hz, so
#
#     offset_forward_m  >=  detection_range_m + 8.5 m     (at 20 m/s)
#
# 26 + 8.5 = 34.5, rounded to 35.0 in `defaults`. At this lane's 60 Hz the same
# arithmetic gives ~6.9 m, so 35.0 is deliberately conservative; do not shave
# it. The cost is the other way: dodge_battery.py sets
# t_flight = offset_forward_m / speed_mps and gates the throw on a straight
# patrol leg of t_flight + throw_window_margin_s, so 35.0 at 20 m/s demands a
# 1.75 s leg that patrol cannot supply (9/10 throws skipped at >= 18 m). A leg
# the loop cannot supply returns SKIPPED — no data, not a failed dodge. Mostly
# skipped rows mean the throw window and waypoint spacing, never the tracker.
#
# ROI interlock: the detector's roi_max_range_m gate runs on the noised cloud
# and depth sigma grows as z^2, so the ceiling must clear the reach by
# 4 * sigma(reach) — 26 m needs 27.2 m against the 28.00 m
# synthetic_depth_detector.yaml ships, and 30 m would need 31.6 m.
# week6_synthetic_depth.launch.py refuses to start on a violation rather than
# delivering a short sensor under a long label.
#
# Report split by ball speed; 8, 14 and 20 are never blended.

defaults:
  # Sized for a 26 m gate at 20 m/s (26 + 8.5, rounded up); raise it with the
  # gate, per the offset rule above. D11/D12 override it downward: they run
  # against the 3.4 m gate, where 6.0 leaves 2.6 m of margin, and their purpose
  # is to be geometrically identical to the flown B02/B03.
  offset_forward_m: 35.0
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 3

runs:
  # ── the question ───────────────────────────────────────────────────────
  - id: D08
    description: "Head-on 20 m/s, true hit — the target case, through the REAL detector, n=30"
    speed_mps: 20.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 30
    # n=30 matches the oracle lane's 28/29 cell, which is the point: this is the
    # like-for-like confirmation run with the detection computed rather than
    # asserted. A Wilson 95% interval on 10/10 bottoms out at 0.72, so 30 is the
    # smallest n that carries the claim.
    #
    # The ball spawns outside the modelled reach and flies in — spawning inside
    # hands the pipeline a detection it never had to acquire. Outside is not
    # enough on its own: the ball flies 5.4 m and the drone closes ~1.4 m during
    # spawn_dead_s before the first cloud can carry it, hence offset 35.0.
    #
    # A long cell has a failure mode a short one does not: station drift. Read
    # the altitude trace before the save count — if altitude drifts
    # monotonically the last throws are not the same experiment as the first,
    # and the cell must be reported as two halves rather than one rate. Failures
    # clustered in the last third of the rep index are drift, not envelope.

  - id: D09
    description: "20 m/s near miss 0.5 m — inside threat radius, must dodge"
    speed_mps: 20.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    expect_dodge: true
    repeats: 10

  - id: D10
    description: "20 m/s wide miss 1.5 m — outside threat radius, must NOT dodge"
    speed_mps: 20.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 10
    # This measures trigger discrimination on a detected non-threat: the ball is
    # genuinely detected and tracked, and the question is whether the trigger
    # fires on a track that is not on a hit course. It is NOT a false-positive
    # rate — the cloud holds only the ball, so background differencing has no
    # clutter to reject — and must never be merged with docs/RESULTS.md's "0
    # false dodges in 31" or with Week 4's B07 0/12. A longer-ranged sensor buys
    # more warning and therefore more opportunity to fire wrongly, so anything
    # other than 0 here is worth reporting whatever the save rate above says.

  # ── Fidelity gate: the same harness against results already in hand ─────
  # Flown on patrol at detection_range_m:=3.4 — the real rendered detector's
  # measured reach — not at 26.0 and not in hover. Scored on `dodged` against
  # the Week 4 patrol envelope (78/78 at <= 8 m/s, 0/17 at 14 m/s). Runs FIRST.
  - id: D11
    description: "14 m/s dead-centre — B03 geometry; fidelity gate at range 3.4, on patrol"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 6
    offset_forward_m: 6.0     # exactly B03, so the two are comparable

  - id: D12
    description: "8 m/s dead-centre — B02 geometry; the working case must stay working"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 6
    offset_forward_m: 6.0     # exactly B02
