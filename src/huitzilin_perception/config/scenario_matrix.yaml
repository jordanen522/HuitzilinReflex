# scenario_matrix.yaml — Week 3, W3-09
#
# Enumerated set of scenarios for the labeled rosbag library.
# Each entry drives spawn_projectile.py and labels the resulting rosbag.
#
# FIELDS
# ------
# id           : unique string ID (used as bag filename prefix + label key)
# label        : "positive" | "negative"
# description  : human-readable summary
# speed_mps    : projectile speed (m/s); 0 for negative scenarios
# approach_angle_deg : 0 = head-on, positive = from right, negative = from left
# miss_distance_m    : lateral miss at drone altitude (0 = direct hit)
# offset_forward_m   : spawn distance ahead of drone
# offset_vertical_m  : vertical spawn offset relative to drone (m); negative = below. Default 0.
# size_class   : "small" | "medium" (set by model radius; currently always medium)
# closest_approach_m : expected closest approach (for ground-truth labeling)
# time_to_closest_s  : estimated time from spawn to closest approach (sim time)
# notes        : anything the detector needs to watch out for
#
# COVERAGE DESIGN — ORIGINALS (S01–S12, N01–N05)
# ----------------------------------------------
# Positives (should trigger /threat/centroid):
#   - Speed: slow (4 m/s), medium (8 m/s), fast (14 m/s)
#   - Angle: head-on (0°), oblique left (−30°), oblique right (+30°)
#   - Miss: direct hit (0 m), near-miss (0.5 m), far-miss (1.5 m)
#   All three variables crossed gives 3×3×3 = 27 positives; reduced to 12 below
#   to keep the first capture session tractable.
#
# Negatives (should NOT trigger /threat/centroid):
#   - No object, drone patrolling normally
#   - Drone executing a turn (egomotion-induced depth change)
#   - Object spawned behind the drone (outside FOV)
#   - Object far below glide path (outside ROI range gate)
#   Budget ≥ 25% negatives to keep false-positive rate meaningful.
#
# COVERAGE DESIGN — TUNE SET (T01–T14, added 2026-08-16)
# -----------------------------------------------------
# Purpose: give threshold fitting a set of its own, so the 17 originals can be
# scored as genuine held-out data. See the SPLITS block below for why that was
# not true before.
#
# Same axes as the originals, deliberately DISJOINT parameter values so the
# tune set cannot be a re-run of the bags the thresholds are meant to be
# scored against:
#   - Speed: 6 / 11 / 17 m/s          (originals use 4 / 8 / 12 / 14)
#   - Angle: 0, ±15°, +22°, ±35°      (originals use 0, +5, -20, -25, +30,
#     -30, and 180 behind-camera -- not the +20/+25 the old shorthand implied)
#   - Miss:  0.0 / 0.35 / 0.9 / 2.0 m (originals use 0.0/0.1/0.4/0.5/1.2/1.5)
#   - Vertical: −7.5 m negative probe (original N04 uses −10.0 m)
#   - Negatives: 4 of 14 = 29%, keeping the ≥ 25% rule above.
# 10 positives + 4 negatives (28.6% negative, clears the >= 25% rule above).
# Every T-positive spawns outside roi_max_range_m (5.00) at offset_forward_m
# 6.6-8.5 m, so its bag keeps the acquisition transient -- smallest margin is
# 1.6 m (T01/T06/T09/T10 at 6.6 m), ~0.27 s of clean background at 6 m/s.
# Simulated in-gate dwell at 15 Hz spans 2.8 (T08) to 5.5 (T01) depth clouds
# per positive, against 3.4-9.0 clouds across the twelve original positives --
# comparable, slightly harder on average. Full arithmetic (ttc and
# closest_approach_m derivations, per-scenario dwell tables, rejected
# alternatives) was worked out in a workspace design note that does not ship
# with this repo; the numbers load-bearing for using this matrix are inlined
# here and in each scenario's own notes field instead.
#
# Two conventions the T-entries follow that the S/N entries do not:
#   - time_to_closest_s = offset_forward_m / speed_mps (straight-line flight
#     time), the same arithmetic every S-entry uses. Negatives carry 0, as
#     N01–N05 do. capture_scenario.sh DOES read it (:46 as TTC, :81 into the
#     label sidecar) — the note here used to say it did not, which predates
#     the sidecar-writing version of the script and is now actively
#     misleading, because score_bags' strict detection window is anchored on
#     exactly this field. The capture operator's stop timing uses it too:
#     SPAWN_LEAD (3 s) + this + ~9 s.
#   - closest_approach_m is the true HORIZONTAL crossing-geometry closest
#     approach, |offset·sin(angle) + miss·cos(angle)|, not the nominal
#     miss_distance_m -- but it EXCLUDES gravity drop and patrol egomotion,
#     the same two things the S/N entries' nominal-miss convention excludes.
#     Week 3 throws are flat (compensate_gravity defaults False in
#     ballistics.py), so the recorded time_to_closest_s may not even be
#     reached before ground impact: T01's nominal closest approach (0.0 at
#     t*=1.10 s) never happens in flight -- the ball hits the ground at
#     t=0.639 s, already ~3.4 m from the drone. This value also assumes a
#     stationary drone (spawn_projectile.py calls compute_spawn with no
#     target_vel_enu); bags captured under patrol measure closest approaches
#     of 1.3-2.6 m for throws this field records as 0.0. It is a DIFFERENT
#     2-D simplification, not a more truthful one -- do not read it as this
#     split being more honest about geometry than S/N on this axis.
#     spawn_projectile calls ballistics.compute_spawn with aim_at_drone=False,
#     so an oblique throw does NOT close on the drone -- S04 (+30°, 6 m) is
#     labelled 0.0 but its 2-D horizontal pass is 3.0 m away. The field is
#     informational (score_bags reads only `label` and the sidecar's
#     detection_window_s), so recording this number costs nothing. The S/N
#     entries are left exactly as they were captured.
#
# roi_max_range_m COUPLING WARNING (T-positives)
# ------------------------------------------------
# Every T-positive spawns outside the shipped roi_max_range_m (5.00 m), at
# offset_forward_m 6.6-8.5 m, specifically so its bag contains the
# acquisition transient (design requirement 5, capture_scenario.sh). Raising
# roi_max_range_m during the retune erodes or destroys that:
#   - at 6.5 m: T01, T06, T09, T10 (all spawn at 6.6) keep only a 0.1 m
#     acquisition margin -- effectively no pre-acquisition background left.
#   - at 8.0 m: T01, T02, T04, T05, T06, T08, T09, T10 (every T-positive
#     except T03 and T07, which spawn at 8.5) start INSIDE the gate. Their
#     bags no longer exercise acquisition at all.
# BINDING CONSEQUENCE: these bags are captured once, over several hours, on
# the Dell, and the retune runs after capture -- it cannot cheaply re-throw.
# A retune that raises roi_max_range_m to 6.6 m or above MUST either
# re-capture the affected T-positives at a larger offset_forward_m, or
# explicitly report which cells no longer exercise acquisition at the new
# gate. Do not silently retune past this line, and do not pretend this
# constraint does not exist.
#
# ROSBAG NAMING CONVENTION
# ------------------------
# week3_<id>_<YYYYMMDD_HHMMSS>.mcap
# Label sidecar: week3_<id>.label.yaml (same directory)

scenarios:

  # ── POSITIVES: head-on, varying speed ────────────────────────────────────
  - id: S01
    label: positive
    description: "Head-on, slow (4 m/s), direct hit"
    speed_mps: 4.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 1.5
    notes: "Baseline slow direct-hit — must detect at all speeds."

  - id: S02
    label: positive
    description: "Head-on, medium (8 m/s), direct hit"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.75
    notes: "Primary design-point speed."

  - id: S03
    label: positive
    description: "Head-on, fast (14 m/s), direct hit"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.43
    notes: "Fast object — will cross the frame quickly; fewer frames to cluster."

  # ── POSITIVES: oblique approach ──────────────────────────────────────────
  - id: S04
    label: positive
    description: "Oblique right (+30°), medium speed, direct hit"
    speed_mps: 8.0
    approach_angle_deg: 30.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.75
    notes: "Lateral component; watch for ROI frustum clipping the approach."

  - id: S05
    label: positive
    description: "Oblique left (−30°), medium speed, direct hit"
    speed_mps: 8.0
    approach_angle_deg: -30.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.75
    notes: "Mirror of S04."

  - id: S06
    label: positive
    description: "Oblique right (+30°), fast (14 m/s), direct hit"
    speed_mps: 14.0
    approach_angle_deg: 30.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.43
    notes: "Worst-case oblique fast; widest ROI half-angle may be needed."

  # ── POSITIVES: near-miss (dangerous — must detect) ────────────────────────
  - id: S07
    label: positive
    description: "Head-on, medium, near-miss (0.5 m)"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.5
    time_to_closest_s: 0.75
    notes: "Still dangerous — within evasion radius. Must trigger centroid."

  - id: S08
    label: positive
    description: "Head-on, fast, near-miss (0.5 m)"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.5
    time_to_closest_s: 0.43
    notes: "Fast near-miss — hardest detection window."

  # ── POSITIVES: wider miss (should detect, Week 4 decides to dodge) ────────
  - id: S09
    label: positive
    description: "Head-on, medium, wide miss (1.5 m)"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 1.5
    time_to_closest_s: 0.75
    notes: "Cluster still within camera FOV; detection node should still flag it."

  - id: S10
    label: positive
    description: "Slow oblique, wide miss"
    speed_mps: 4.0
    approach_angle_deg: -20.0
    miss_distance_m: 1.2
    offset_forward_m: 5.0
    size_class: medium
    closest_approach_m: 1.2
    time_to_closest_s: 1.25
    notes: "Edge-of-regime: slow + oblique + wide miss. Still positive label."

  # ── TRAIN/TEST SPLIT POSITIVE (held-out) ─────────────────────────────────
  - id: S11
    label: positive
    description: "Head-on, medium speed, direct hit — held-out test set"
    speed_mps: 8.0
    approach_angle_deg: 5.0
    miss_distance_m: 0.1
    offset_forward_m: 7.0
    size_class: medium
    closest_approach_m: 0.1
    time_to_closest_s: 0.875
    notes: "Slight offset from S02 — part of held-out test set. Do not tune on this bag."

  - id: S12
    label: positive
    description: "Fast oblique left, near-miss — held-out test set"
    speed_mps: 12.0
    approach_angle_deg: -25.0
    miss_distance_m: 0.4
    offset_forward_m: 6.0
    size_class: medium
    closest_approach_m: 0.4
    time_to_closest_s: 0.5
    notes: "Held-out. Challenges oblique detection at high speed."

  # ── NEGATIVES: no object ─────────────────────────────────────────────────
  - id: N01
    label: negative
    description: "No object spawned, drone patrolling normally"
    speed_mps: 0.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 0.0
    size_class: none
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "Clean negative. No spawn command issued. Detector must be silent."

  - id: N02
    label: negative
    description: "No object, drone executing a patrol turn"
    speed_mps: 0.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 0.0
    size_class: none
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "Capture waypoint-transition manoeuvre. Egomotion compensation must suppress false trigger."

  - id: N03
    label: negative
    description: "Object spawned behind the drone (outside camera FOV)"
    speed_mps: 8.0
    approach_angle_deg: 180.0
    miss_distance_m: 0.0
    offset_forward_m: -6.0
    size_class: medium
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "Object flies away from camera; FOV gate should suppress. Spawn offset_forward_m is negative."

  - id: N04
    label: negative
    description: "Object well below glide path (outside range gate, ~10 m below)"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 6.0
    offset_vertical_m: -10.0
    size_class: medium
    closest_approach_m: 10.0
    time_to_closest_s: 0
    notes: "CAPTURE AT ALTITUDE: drone must fly >= ~10.5 m (e.g. takeoff_alt_m: 12.0) or the spawn lands underground and capture_scenario.sh aborts. Ball passes ~10 m below -> camera range >= 10 m > roi_max_range_m, which ships at 5.0 (8.0 was tried and is a recorded null) -> range gate must reject. The margin is 2x, so this scenario does not depend on which of the two is loaded."

  - id: N05
    label: negative
    description: "No object — held-out test set negative"
    speed_mps: 0.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 0.0
    size_class: none
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "Held-out. 60-second clean patrol segment. FP rate measured here."

  # ===== TUNE SET (T01–T14) ================================================
  # The only split thresholds may be fitted against. Parameter values are
  # disjoint from S01–S12 / N01–N05 by construction — see COVERAGE DESIGN.

  # ── TUNE POSITIVES: head-on, varying speed ───────────────────────────────
  - id: T01
    label: positive
    description: "Head-on, slow (6 m/s), direct hit"
    speed_mps: 6.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 6.6
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 1.1
    notes: "Slow baseline (6.6 / 6.0 = 1.10 s). Enters the 5 m range gate at ~0.27 s; the flat Week 3 throw reaches the ground ~0.64 s after spawn from a 2 m hover, so the usable window is ~0.37 s (~5-6 clouds at 15 Hz). Same dwell as S01 by design."

  - id: T02
    label: positive
    description: "Head-on, medium (11 m/s), direct hit"
    speed_mps: 11.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 7.7
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.7
    notes: "Mid-speed anchor (7.7 / 11.0 = 0.70 s). Range gate entered at ~0.25 s; ~0.31 s usable (~4.7 clouds at 15 Hz)."

  - id: T03
    label: positive
    description: "Head-on, fast (17 m/s), direct hit"
    speed_mps: 17.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 8.5
    size_class: medium
    closest_approach_m: 0.0
    time_to_closest_s: 0.5
    notes: "Fast anchor (8.5 / 17.0 = 0.50 s). Range gate entered at ~0.21 s, so only ~0.24 s (~3.6 clouds) inside the ROI — the frame-count-limited end of the tune set."

  # ── TUNE POSITIVES: oblique approach ─────────────────────────────────────
  - id: T04
    label: positive
    description: "Shallow oblique right (+15°), medium speed"
    speed_mps: 11.0
    approach_angle_deg: 15.0
    miss_distance_m: 0.0
    offset_forward_m: 7.7
    size_class: medium
    closest_approach_m: 1.99
    time_to_closest_s: 0.7
    notes: "Crossing geometry: true closest approach 7.7*sin(15°) = 1.99 m, not 0. Leaves the 45° ROI cone before the range gate does — visible from ~0.26 s to ~0.53 s (~4.1 clouds at 15 Hz)."

  - id: T05
    label: positive
    description: "Shallow oblique left (−15°), medium speed"
    speed_mps: 11.0
    approach_angle_deg: -15.0
    miss_distance_m: 0.0
    offset_forward_m: 7.7
    size_class: medium
    closest_approach_m: 1.99
    time_to_closest_s: 0.7
    notes: "Mirror of T04. Left/right pairs exist because the +30/-30 pair (S04/S05) showed an asymmetry once."

  - id: T06
    label: positive
    description: "Wide oblique right (+35°), slow — widest angle in the library"
    speed_mps: 6.0
    approach_angle_deg: 35.0
    miss_distance_m: 0.0
    offset_forward_m: 6.6
    size_class: medium
    closest_approach_m: 3.79
    time_to_closest_s: 1.1
    notes: "True closest approach 6.6*sin(35°) = 3.79 m — inside roi_max_range_m (5.0) but the binding gate here is roi_half_angle_deg (45.0), which the ball exits before it ever reaches closest approach. Deliberately slow: at 17 m/s this angle would leave under 3 clouds. This is the scenario that would referee any change to roi_half_angle_deg."

  - id: T07
    label: positive
    description: "Head-on, fast (17 m/s), near-miss (0.35 m) — S08 analogue"
    speed_mps: 17.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.35
    offset_forward_m: 8.5
    size_class: medium
    closest_approach_m: 0.35
    time_to_closest_s: 0.5
    notes: "S08 ANALOGUE -- HYPOTHESIS, NOT A GUARANTEE. S08's failure mechanism is unconfirmed: detector.yaml:92 already records the range/dwell hypothesis for S08 as refuted (\"S08's failure isn't a range/dwell issue after all\"). T07 is defensible as reproducing the one axis on which S08 differs from the PASSING S03 -- fast head-on with a small non-zero lateral miss (0.5 m), vs S03's exact 0.0 -- at a disjoint operating point: 17 m/s / 0.35 m vs S08's 14 m/s / 0.5 m. It is NOT earned as 'reproduces the failure mode'; no scenario can be certified to reproduce an unknown mechanism before a bag exists. If T07 detects cleanly at shipped thresholds, that is itself informative -- it narrows S08's failure toward something specific to the S08 capture rather than to this geometry. Root-cause the S08 false negative against THIS bag, never against S08 — S08 is held-out now."

  - id: T08
    label: positive
    description: "Fast oblique right (+22°) — hardest tune positive"
    speed_mps: 17.0
    approach_angle_deg: 22.0
    miss_distance_m: 0.0
    offset_forward_m: 6.8
    size_class: medium
    closest_approach_m: 2.55
    time_to_closest_s: 0.4
    notes: "Worst case: fast AND oblique. True closest approach 6.8*sin(22°) = 2.55 m. Inside both gates for only ~0.19 s (~3 clouds), so this is the scenario cluster_min_points changes will move first (min_track_updates lives in evasion.yaml / evasion_node.py, not the detector -- score_bags scores only /threat/centroid from the detector, so this split cannot referee that threshold). Expect it to be the tune set's own S08 if anything is."

  # ── TUNE POSITIVES: wider miss ───────────────────────────────────────────
  - id: T09
    label: positive
    description: "Head-on, slow, wide miss (2.0 m)"
    speed_mps: 6.0
    approach_angle_deg: 0.0
    miss_distance_m: 2.0
    offset_forward_m: 6.6
    size_class: medium
    closest_approach_m: 2.0
    time_to_closest_s: 1.1
    notes: "Widest pure-lateral miss in the library (originals stop at 1.5 m). Still a positive: detection is not the dodge decision."

  - id: T10
    label: positive
    description: "Slow oblique left (−35°), offset miss — S10 analogue"
    speed_mps: 6.0
    approach_angle_deg: -35.0
    miss_distance_m: 0.9
    offset_forward_m: 6.6
    size_class: medium
    closest_approach_m: 3.05
    time_to_closest_s: 1.1
    notes: "Edge-of-regime like S10 (slow + oblique + wide miss) at disjoint values. The miss offset partly CANCELS the crossing geometry here: 6.6*sin(-35°) + 0.9*cos(-35°) = -3.79 + 0.74 = -3.05 m, so the true approach is 3.05 m and not the nominal 0.9 m."

  # ── TUNE NEGATIVES ───────────────────────────────────────────────────────
  - id: T11
    label: negative
    description: "No object, drone changing altitude (vertical egomotion)"
    speed_mps: 0.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 0.0
    size_class: none
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "No spawn. Capture a window spanning a commanded ~2 m climb and descent (GUIDED altitude change, or a takeoff_alt_m step). N02 covers yaw egomotion only; this covers the vertical axis, where the whole ground plane sweeps through the range gate at once. Detector must stay silent."

  - id: T12
    label: negative
    description: "Object spawned behind the drone (outside camera FOV)"
    speed_mps: 11.0
    approach_angle_deg: 180.0
    miss_distance_m: 0.0
    offset_forward_m: -7.5
    size_class: medium
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "N03's probe at disjoint values (11 m/s, -7.5 m). Angle stays 180° because 'behind' is structural, not a tuning point. Object flies away from the camera; the FOV/cone gate must suppress it. offset_forward_m is negative on purpose."

  - id: T13
    label: negative
    description: "Object well below glide path (~7.5 m below, outside range gate)"
    speed_mps: 11.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 7.7
    offset_vertical_m: -7.5
    size_class: medium
    closest_approach_m: 7.5
    time_to_closest_s: 0
    notes: "CAPTURE AT ALTITUDE: drone must fly >= 8.0 m (0.5 - (-7.5)) or capture_scenario.sh exits 3 on the /huitzilin/odom z check; use takeoff_alt_m: 9.0 so the spawn sits at z=1.5 m with margin, then restore 2.0. The ball passes >= 7.5 m below and only falls further, so camera range never drops under 7.5 m > roi_max_range_m (5.0). NOTE the margin is 1.5x, not N04's 2x: this scenario asserts roi_max_range_m < 7.5. If a retune ever wants a range gate above that, re-derive this scenario rather than forcing the threshold under it."

  - id: T14
    label: negative
    description: "No object — clean patrol, FP floor for the tune set"
    speed_mps: 0.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    offset_forward_m: 0.0
    size_class: none
    closest_approach_m: 999
    time_to_closest_s: 0
    notes: "No spawn. 45 s of straight-leg patrol with no manoeuvre. This is the tune set's false-positive floor — the analogue of N01/N05, which are now off-limits for tuning."


  # == HELD-OUT SET (H01-H18, HN01-HN06) - added 2026-08-21 ==================
  #
  # NEVER tune against these bags - not once, not to debug a threshold, not
  # just to look. Scored ONCE per frozen configuration, via
  # docs/bag_capture_runbook.md's ground-truth scoring section, which fixes
  # the match radius, K, the window, and the void-bag rules.
  #
  # WHY IT EXISTS. `test` carries TWO positives and `train` was fitted on, so
  # neither is enough to measure recall on scenarios the detector never saw
  # -- and no bag captured before 2026-08-21 records /gz/dynamic_poses, so
  # none of them can even say whether a detection was OF THE BALL rather
  # than of terrain.
  #
  # DIFFERENT SENSOR, DIFFERENT WORLD, DIFFERENT PREFIX. Captured on
  # worlds/huitzilin_runway_ar0234.sdf against the AR0234 + 10 mm M12
  # (+/-13.5 x 11.0 deg, 0.2-35 m clip) through week7_rendered.launch.py on
  # params/rendered_detector.yaml. These are NOT Week 3 data and must not be
  # named as though they were:
  #     BAG_PREFIX=heldout_ ./scripts/capture_scenario.sh H01
  #
  # POSITIVES ARE FLOWN IN HOVER, AND THAT IS FORCED. At a 31 m standoff a
  # patrolling drone translates ~4 m during the ball's 1.55 s flight, and
  # these entries do not lead the shot (aim_at_drone False, no
  # target_vel_enu), so the ball would arrive several metres off-axis - far
  # outside a +/-13.5 deg sector. Under patrol these rows would measure the
  # geometry, not the detector. Egomotion is not left untested: HN01 and HN03
  # are patrol negatives, which is where the egomotion FP risk actually is.
  #
  # GEOMETRY (amendment A3). compensate_gravity holds the HORIZONTAL speed at
  # speed_mps and adds vz0 = 0.5*g*t, so the loft grows with offset/speed and
  # lifts the ball out of the +/-11 deg vertical sector. Keeping the whole
  # trajectory inside it bounds the standoff:
  #
  #     max elevation = atan(g*d / (4*v^2)) <= 11 deg   =>   d <= 0.0793 * v^2
  #
  # so offset co-varies with speed BY PHYSICS: 3.5 / 6.0 / 13.0 / 20.0 / 25.0
  # / 31.0 m at 7 / 9 / 13 / 16 / 18 / 20 m/s. The same bound holds the true
  # launch speed within 7 % of the label on every row. REPORT THE OFFSET
  # BESIDE EVERY PER-SPEED NUMBER; it is a covariate, not a nuisance to hide.
  #
  # ANGLES ARE ALL INSIDE THE SECTOR (0, +/-4, +/-8, +/-11 deg). The +/-28 deg
  # arm of the original design was deleted because it lies outside +/-13.5 deg
  # for the whole flight and would have built four guaranteed misses into the
  # set. That makes this set EASIER, and scopes the claim to recall WITHIN THE
  # DEFENDED SECTOR. The deleted case is not lost: HN05 is an out-of-sector
  # ball, where a NON-detection is the correct answer.
  #
  # DISJOINTNESS. Every H speed (7/9/13/16/18/20) is unused by S/N (4/8/12/14)
  # and by T (6/11/17), so no H scenario can share a full (speed, angle, miss)
  # triple with a tuning scenario. The angles (+/-4, +/-8, +/-11) and the
  # misses (0.2, 0.7, 1.1) are new as well.
  #
  # closest_approach_m follows the T convention, |offset*sin(angle) +
  # miss*cos(angle)|: a 2-D horizontal crossing geometry against a STATIONARY
  # drone. It is informational - score_bags reads `label` and the sidecar's
  # detection_window_s - and it is NOT the truth used for attribution, which
  # comes from /gz/dynamic_poses.

