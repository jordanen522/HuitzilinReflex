  # ===== RENDERED-LANE TUNE SET (RT01–RT10, added 2026-08-22) ================
  # Retuning the rendered detector (params/rendered_detector.yaml) needs a
  # tune split captured in the same world, analogous to T01-T14 -- NOT
  # T01-T14 itself, which is the OAK-D/week3 world and the wrong sensor
  # entirely, and NOT the H-set, which stays closed while this retuning work
  # is ongoing. This split did not exist when the range-adaptive
  # background-map fix (bg_map_far_leaf_m / bg_map_range_split_m) was
  # designed; it is added now so later rendered-lane changes have a legitimate
  # split to validate against, instead of tuning against the H-set.
  #
  # Coverage mirrors the H-set's structure (world, camera, hover flight,
  # compensate_gravity:true for the throw to reach at range) but at every
  # numeric value DISJOINT from H01-H18/HN01-HN06, so this split is not simply
  # a relabelling of held-out data -- same discipline S/T and H already
  # follow. Deliberately smaller than the 18+6 H-set: six positives spanning
  # near (RT01, under the z=15.0 m crossover the fix targets), the crossover
  # itself (RT02/RT03, straddling it), and far (RT04-RT06, up to 28.0 m, near
  # the 28.00 m ROI ceiling) plus four negatives -- two structural
  # (patrol/hover clean-scene FP floors, which exercise the SAME far-range
  # terrain the fix touches, since background clutter beyond 15 m is in frame
  # regardless of where or whether a ball spawns), one receding-ball, one
  # off-axis-at-range (tests sector rejection is not disturbed by the coarser
  # far-map leaf). closest_approach_m/time_to_closest_s follow the H-set's own
  # convention: ttc = offset_forward_m / speed_mps, closest = offset_forward_m
  # * sin(angle) [+ miss_distance_m where both are given].
