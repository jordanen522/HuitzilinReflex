# Rendered battery for week7_rendered.launch.py — the 20 m/s question asked
# through the whole real pipeline: /threat/centroid is computed by the unmodified
# detector_node.py from a cloud a Gazebo depth camera actually rendered, with
# depth_noise_node's modelled stereo error applied. Never run it alongside the
# oracle or synthetic-depth stacks; two publishers on /threat/centroid give the
# tracker two uncorrelated views of one ball.
#
# The sensor is the world file, not a launch argument — there is no
# detection_range_m in this lane. Reach is an outcome of optics, renderer and
# noise; sector (±13.5 x 11.0 deg) and rate (30 Hz requested, ~23 Hz delivered
# through the ros_gz_bridge hop, so t_dead = 0.155 + 1.380/f ≈ 0.215 s) live in
# models/iris_ar0234/model.sdf. Quote that file and the delivered rate beside
# every number. The error is modelled rather than rendered
# (sigma(z) = 0.30*(z/26)^2, correlated over ~7 px — an input, not a
# measurement) and the optics are of a proposed part, so a result here is
# evidence about the pipeline given that sensor model, not a hardware claim.
#
# Order of operations: the fidelity gate (G01/G02) runs FIRST, on the baseline
# world and camera with noise off, on patrol, scored on `dodged` against the
# Week 4 patrol envelope. Until it reproduces that envelope the plumbing is
# unproven and the R rows mean nothing — G01 does not currently reproduce it,
# see docs/KNOWN_ISSUES.md. Score the R rows on the counterfactual instead, per
# docs/RESULTS.md §10, and never blend the gate's dodge counts with those saves.
#
# Running it:
#   # gate: baseline world, noise off, patrol
#   ros2 launch huitzilin_perception week7_rendered.launch.py with_patrol:=true \
#       gz_cloud_topic:=/gz/oak/depth/points sigma_ref_m:=0.0 \
#       detector_params:=.../params/detector.yaml
#   DRONE_MODEL=iris_depth ./scripts/run_dodge_battery.sh week7
#
#   # envelope: ar0234 world, hover. counterfactual_min_m is not a battery
#   # column and cannot be recovered afterwards, so start this one first.
#   python3 scripts/hz_counterfactual.py --drone-model iris_ar0234 --out /tmp/week7_cf.csv &
#   DRONE_MODEL=iris_ar0234 EXTRA_ARGS="-p hover_mode:=true" \
#       ./scripts/run_dodge_battery.sh week7
#
# DRONE_MODEL=iris_ar0234 is required on the ar0234 arm and on hz_counterfactual;
# both default to iris_depth, which does not exist in that world. Hover is
# required for R01-R04 — under patrol 0 of 98 throws have arrived inside 0.109 m,
# in hover 40/40 did. Read first_det_range_m before any save rate: with no
# launched reach to check it against, it is the measurement of the reach itself.
#
# Offset rule: the ball must spawn outside everything the pipeline can see. The
# outermost gate is the detector's roi_max_range_m (28.0 m), not the camera's
# 35 m far clip, and spawn dead time, drone closure and one frame of ball travel
# eat another 7.6 m at 20 m/s — so offset >= 35.6. 36.0 is used at all three
# speeds even though 8 m/s would need only ~31.8, because a matched envelope
# must not vary its geometry with its independent variable.

defaults:
  # Offset rule above; raise this whenever roi_max_range_m is raised.
  offset_forward_m: 36.0
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 3

runs:
  # ── The matched envelope: one sensor, one geometry, three speeds ────────
  # Only speed_mps differs across R01-R03; report them separately. Equal n is
  # deliberate — unequal arms invite reading a difference in interval width as a
  # difference in effect — and n=30 matches the oracle lane's 28/29 cell, so the
  # two headline results are comparable in power as well as in geometry.
  - id: R01
    description: "8 m/s head-on, hover — the BASELINE arm of the 2.5x claim"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 30
    # 8.0 matches the Week 4 baseline (78/78 there), but re-flies it rather than
    # re-using it: a patrol dodge count and a hover save rate are different
    # quantities.

  - id: R02
    description: "14 m/s head-on, hover — the speed the OAK-D lane scored 0/17 at"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 30
    # The intermediate point, and the most informative one if the envelope has
    # an edge: Week 4's rendered OAK-D collapsed here (0/17), and the tca law
    # attributes that to reach rather than speed. Holding at 14 m/s here would
    # confirm that prediction on rendered perception.

  - id: R03
    description: "20 m/s head-on, hover — the target case, whole real pipeline, n=30"
    speed_mps: 20.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 30
    # A long cell has a failure mode a short one does not: station drift. Read
    # the altitude trace before the save count — if altitude drifts
    # monotonically the last throws are not the same experiment as the first,
    # and the cell must be reported as two halves rather than one rate. Failures
    # clustered in the last third of the rep index are drift, not envelope.

  # ── Negative control ────────────────────────────────────────────────────
  - id: R04
    description: "20 m/s wide miss 1.5 m — must NOT dodge; real scene, real clutter"
    speed_mps: 20.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 15
    # A genuine false-positive measurement, which the synthetic lane cannot
    # produce: here the cloud carries ground plane, runway and standoffs, so
    # background differencing has real clutter to reject. A false dodge means
    # the stack fabricated a threat from that clutter — what Week 4's B07 (0/12)
    # measured. The ball is also detected in these throws, so a fire has two
    # possible causes; read the log to tell them apart and report separately.

  # ── Fidelity gate: the same harness against results already in hand ─────
  # Baseline world, baseline camera, noise off, patrol, at detector.yaml's own
  # 5 m ROI. Scored on `dodged` against the Week 4 patrol envelope. Runs FIRST.
  - id: G01
    description: "14 m/s dead-centre — B03 geometry; fidelity gate, baseline camera, patrol"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 6
    offset_forward_m: 6.0     # exactly B03, so the two are comparable

  - id: G02
    description: "8 m/s dead-centre — B02 geometry; the working case must stay working"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    repeats: 6
    offset_forward_m: 6.0     # exactly B02
