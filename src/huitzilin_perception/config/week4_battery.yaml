# week4_battery.yaml — Week 4 dodge battery (see docs/week4_dodge_runbook.md).
#
# Every run spawns one projectile at the patrolling drone and scores the
# outcome against Gazebo ground truth. compensate_gravity: true makes
# "direct hit" runs genuinely intercept the drone (flat Week 3 throws pass
# 0.7-2.8 m below it). expect_dodge: false rows are the false-dodge check.
#
# No hard success-rate gate (2026-07-16 decision): the battery reports
# measured rates; only harness errors fail the run.

defaults:
  offset_forward_m: 6.0
  offset_vertical_m: 0.0
  compensate_gravity: true
  # oblique runs aim the spawn ray at the drone — without this a 30° "hit"
  # passes ~3 m wide
  aim_at_drone: true
  repeats: 3

runs:
  - id: B01
    description: "Head-on slow (4 m/s), true hit"
    speed_mps: 4.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    # Shorter throw than the 6.0 m default, because at 4 m/s that default flies
    # for 1.50 s and the throw-window gate then needs 1.80 s of straight leg at
    # cruise. The 12 m patrol loop's best observed leg is 2.18 s and it rarely
    # coincides with the 95%-cruise floor, so B01 was SKIPPED on every attempt
    # across batteries v12-v23 — measured, not assumed. 4.0 m gives a 1.00 s
    # flight needing 1.30 s, which this loop supplies routinely.
    #
    # Shortening the flight is the right knob: lowering throw_window_margin_s
    # would buy the same window by weakening the gate that fixed the aiming, and
    # lengthening the patrol loop would move the baseline every other scenario is
    # measured against. The scenario still tests what it claims, a slow head-on
    # intercept, just from 4 m. One caveat when reading its numbers: 4 m starts
    # the ball inside the 5 m range gate, so B01 is the only scenario whose
    # detection is not range-limited — its first_det_range_m is not comparable to
    # the others.
    offset_forward_m: 4.0

  - id: B02
    description: "Head-on medium (8 m/s), true hit — design point"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B03
    description: "Head-on fast (14 m/s), true hit — hardest window"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B04
    description: "Oblique +30deg medium, true hit"
    speed_mps: 8.0
    approach_angle_deg: 30.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B05
    description: "Oblique -30deg medium, true hit"
    speed_mps: 8.0
    approach_angle_deg: -30.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B06
    description: "Near miss 0.5 m medium — inside threat radius, must dodge"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    expect_dodge: true

  - id: B07
    description: "Wide miss 1.5 m medium — outside threat radius, must NOT dodge"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 2
