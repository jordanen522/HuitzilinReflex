# Dodge battery (procedure: docs/dodge_battery_runbook.md).
#
# Every run spawns one projectile at the patrolling drone and scores the outcome
# against Gazebo ground truth. compensate_gravity: true makes "direct hit" runs
# genuinely intercept (a flat throw passes 0.7-2.8 m below the drone).
# expect_dodge: false rows are the false-dodge check.
#
# No hard success-rate gate by design: the battery reports measured rates and
# only harness errors fail the run. Results are an envelope split by ball speed,
# never a blended rate (CLAUDE.md).

defaults:
  offset_forward_m: 6.0
  offset_vertical_m: 0.0
  compensate_gravity: true
  # oblique runs aim the spawn ray at the drone — without this a 30° "hit"
  # passes ~3 m wide
  aim_at_drone: true
  repeats: 3

runs:
  - id: B01
    description: "Head-on slow (4 m/s), true hit"
    speed_mps: 4.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
    # Shorter than the 6.0 m default: at 4 m/s that default flies 1.50 s and the
    # throw-window gate then needs 1.80 s of straight leg at cruise, which the
    # 12 m loop never supplied — B01 was skipped on every attempt. 4.0 m needs
    # 1.30 s, which it supplies routinely.
    #
    # Shortening the flight is the right knob: lowering throw_window_margin_s
    # would weaken the gate that fixed the aiming, and lengthening the patrol
    # loop would move the baseline every other scenario is measured against.
    # CAVEAT when reading B01: 4 m starts the ball inside the 5 m range gate, so
    # it is the only scenario whose detection is not range-limited and its
    # first_det_range_m is not comparable to the others.
    offset_forward_m: 4.0

  - id: B02
    description: "Head-on medium (8 m/s), true hit — design point"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B03
    description: "Head-on fast (14 m/s), true hit — hardest window"
    speed_mps: 14.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B04
    description: "Oblique +30deg medium, true hit"
    speed_mps: 8.0
    approach_angle_deg: 30.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B05
    description: "Oblique -30deg medium, true hit"
    speed_mps: 8.0
    approach_angle_deg: -30.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: B06
    description: "Near miss 0.5 m medium — inside threat radius, must dodge"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    expect_dodge: true

  - id: B07
    description: "Wide miss 1.5 m medium — outside threat radius, must NOT dodge"
    speed_mps: 8.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 2
