# evasion.yaml — Week 4 evasion-node tuning (see docs/dodge_battery_runbook.md).
#
# Sweepable at runtime via `ros2 param set /evasion <key> <val>` (the dodge
# battery's sweep mode uses this): dodge_speed_mps, threat_radius_m,
# trigger_horizon_s, dodge_duration_s, min_track_updates.
# Kalman keys are fixed at node start (tracker is constructed once).

evasion:
  ros__parameters:
    # Kalman filter (fixed at node start)
    process_accel_std: 3.0     # m/s^2 accel noise; absorbs drag/stereo mismatch
    meas_std_m: 0.15           # centroid measurement noise (stereo + clustering)
    # (forward, left, up) sigma in base_link, for a sensor whose depth and
    # bearing noise differ (e.g. a stereo/mono pair: depth error grows as
    # z^2, lateral as z). All-zero = disabled, use the isotropic meas_std_m
    # above. Mirrors the identical sentinel convention in
    # oracle_detector.yaml's noise_std_xyz_m.
    meas_std_xyz_m: [0.0, 0.0, 0.0]
    init_vel_std: 15.0         # m/s prior; covers throws up to 14 m/s
    track_timeout_s: 0.5       # sim s of silence before a track is dropped
    # Multi-hypothesis association (fixed at node start)
    # The tracker keeps several candidate tracks instead of forcing one filter
    # to represent whatever centroid arrived last. Root cause it fixes
    # (measured): the detector emits ~1.4 false
    # positives/s, so a stale FP track was usually alive when a ball arrived
    # and — after a single rejection — its inflated covariance SWALLOWED the
    # ball, fitting a ~38 m/s velocity along the FP-to-ball line. Six frames to
    # learn what takes two: 0.267 s, against a tca of 0.18-0.26 s at commit.
    max_tracks: 6              # hypothesis budget; weakest (fewest updates) evicted
    # Widest position uncertainty a hypothesis may claim when bidding for a
    # centroid. This is what stops a bloated track swallowing the ball: an
    # uninformed filter (init_vel_std 15 m/s) honestly believes its object
    # could be metres away within a few frames, and a chi2 gate that wide
    # accepts anything in the room. 0.75 m covers 11 m/s of ball travel at the
    # 15 Hz detector rate, with the gate's margin on top.
    max_assoc_sigma_m: 0.75
    # Trigger policy
    min_track_updates: 3       # confirmations before a dodge may fire
    threat_radius_m: 0.75      # predicted pass inside this radius -> dodge
    trigger_horizon_s: 1.5     # only dodge if TCA is sooner than this
    prediction_horizon_s: 3.0  # numeric closest-approach search window
    latency_budget_s: 0.15     # centroid stamp -> dodge command, sim s
    # Dodge maneuver
    dodge_speed_mps: 1.5       # master doc: ~1.5 m/s velocity spike
    dodge_duration_s: 1.0      # how long the spike streams
    dodge_floor_m: 1.0         # SAFETY: no dodge may descend below this AGL.
                               # Descending throws make the geometric escape
                               # point DOWN (measured dir_body z = -0.83); at
                               # 2 m the drone flew into the runway and
                               # disarmed. The clamp caps the downward part to
                               # the headroom above this floor and re-spends
                               # the rest horizontally. Raise for real flight.
    dodge_max_speed_mps: 6.0   # cap on cruise + escape. The dodge ADDS its
                               # escape to the drone's current velocity rather
                               # than replacing it: a ball is aimed where the
                               # cruise predicts the drone will be, so escape
                               # is deviation from that extrapolation, and a
                               # command that replaced a 4.2 m/s cruise with a
                               # 1.5 m/s dodge shed 2.5-3.9 m/s and left the
                               # drone ON the predicted line whenever the
                               # escape pointed along the cruise (measured
                               # escape vs alignment r = -0.911,
                               # min_dist r = -0.67). Cruise 4.2 + escape 1.5
                               # asks for 5.7; the cap is spent on the cruise
                               # term, never on the escape.
    recover_hold_s: 0.5        # zero-velocity settle before patrol resumes
    patrol_handoff_s: 0.8      # silent gap before patrol resumes; MUST exceed
                               # the bridge cmd_timeout_s (0.7) or zero-velocity
                               # handback fights patrol position setpoints
    evade_cmd_rate_hz: 20.0    # /cmd/evade stream rate while evading
    auto_resume_patrol: true   # call /huitzilin/start_patrol true after recovery

    # acceleration feedforward
    # A velocity-only setpoint makes the position controller discover the
    # acceleration for itself, and it does so gently: escape displacement was
    # measured rising at ~2 m/s^2 while the tilt ceiling permits
    # g*tan(ATC_ANGLE_MAX) = 5.66. Raising dodge_speed does NOT fix this
    # (1.5 -> 4.0 was a measured null, escape identical to the centimetre)
    # because a bigger velocity error meets the same internal shaping. This
    # states the demand instead of waiting for the error to build it.
    #
    # 0.0 = OFF = the velocity-only command every recorded result flew under.
    # Whether ArduPilot honours the acceleration fields in GUIDED must be
    # MEASURED: an ignored field is indistinguishable from a useless lever, so
    # an A/B that shows nothing is reported as "unsupported", not "no effect".
    evade_accel_ff_mps2: 0.0
    evade_accel_topic: "/cmd/evade_accel"

    # ALERT cue
    # Confirmation is the most expensive term in the reaction budget: three
    # updates at the measured 14.5 Hz cost 0.21 s, most of a 14 m/s ball's
    # flight inside detection range.
    #
    # This does NOT re-open the measured null on min_track_updates 3 -> 2.
    # That null weakened confirmation PERMANENTLY, against a false-positive
    # stream running the whole time, and lost more than it bought (tca +0.044 s
    # but dodge success 13/18 -> 11/16). Here the relaxed threshold applies
    # only inside cue_timeout_s of an external cue that something fast is
    # inbound, and reverts on its own. With nothing publishing cue_topic these
    # values are inert and behaviour is identical to before.
    cue_topic: "/threat/cue"
    alert_min_track_updates: 2
    cue_timeout_s: 2.0

    # vertical escape
    # Vertical is the axis a quadrotor is fastest on: collective thrust needs
    # no tilt, while a lateral escape must tilt before it translates. Off by
    # default because the measured null (|u_z| vs min_dist, r = -0.077) says
    # it bought nothing UNDER THE OLD AUTHORITY REGIME, where the controller
    # never demanded near the tilt limit anyway. Re-open it only alongside the
    # feedforward above, and say so in the commit.
    #
    # Gated on the threat not descending onto the drone (the FMEA rule, now a
    # predicate rather than a blanket refusal) and on the ceiling below.
    allow_upward_escape: false
    # Matches FENCE_ALT_MAX in hw_frame.parm. FENCE_ACTION 1 turns a breach
    # into an RTL, so a dodge that busts the fence has ended the flight even if
    # it cleared the ball. Applied to upward escapes whether or not
    # allow_upward_escape is set -- that path used to be unclamped entirely.
    escape_ceiling_m: 5.0
