# detector.yaml
# All detection thresholds for detector_node.py; the node holds no magic
# numbers of its own. Tune against the bag library and commit the sweep that
# justifies the change. The library is saturated (recall 100%), so it cannot
# referee a threshold change on its own, and every trigger-side lever measured
# so far is a null — see docs/RESULTS.md §7.
#
# Parameters are cached at construction and there is no set-parameter callback:
# `ros2 param set` is accepted and ignored. Every change needs a node restart.

detector:
  ros__parameters:

    # Diagnostics
    # Per-stage survivor counts (raw -> range -> angle -> voxel -> fg ->
    # clusters -> ball_sized -> score). Chatty; enable only while diagnosing a
    # specific throw. Not a latency suspect — measured at 1.4-2.3 ms/frame.
    debug_funnel: false
    debug_funnel_throttle_s: 1.0

    # Wall-time breakdown per stage, hottest first, every profile_window_frames
    # clouds. This is how the ~160 ms cloud callback was traced to
    # voxel_downsample (66-74 -> 5-17 ms) and cluster_all (12-71 -> 2-20 ms)
    # rather than to transport. Turn it on before changing the callback.
    profile_stages: false
    profile_window_frames: 30

    # Directory for one .npz per cloud frame (post-voxel egomotion-compensated
    # cloud, foreground mask, every cluster, publish decision) — attributes a
    # miss where the funnel's survivor counts only report that one happened.
    # Costs ~40 ms and ~250 KB per frame, so it drops frames: no latency or
    # consistency number from a dumping run is valid. Empty string = off.
    debug_dump_dir: ""

    # Cloud transport
    # /oak/points is a 7.37 MB sample and BEST_EFFORT loses ~75% of it to UDP
    # fragmentation (3.99 Hz vs 14.43 Hz reliable). Set false on real hardware,
    # where DepthAI publishes best-effort. The queue depth drops clouds under
    # load, so false-positive counts only compare across comparably loaded runs.
    cloud_reliable: true
    cloud_queue_depth: 5

    # Input cloud axis convention
    # gz-sim PointCloudPacked stays in the gz sensor body frame (X fwd, Y left,
    # Z up); <optical_frame_id> renames the header only. "gz_flu" remaps points
    # to REP-103 optical at ingest. Set "optical" for a real OAK-D (DepthAI
    # already outputs optical-convention clouds).
    cloud_convention: "gz_flu"

    # ROI / range gate
    # Keep only points within this depth range (metres).
    # Reliable OAK-D Lite working band; clip edges that are too noisy.
    roi_min_range_m: 0.30
    roi_max_range_m: 5.00   # 8.0 let far background (12-19 m) dominate the diff: attitude jitter
                             # at long range swamps diff_threshold and floods fg every frame
                             # (S02 funnel: fg=25k-90k, clusters=0). 6.5 regressed recall to 80%.
                             # 5.0 is the best measured train recall (90%, TP=9/FN=1); S08 (14 m/s)
                             # stays a known false negative and is not a range problem.

    # Forward half-angle of the ROI frustum (degrees).
    # Points outside this cone ahead of the camera are discarded.
    roi_half_angle_deg: 45.0   # widened 40->45 for oblique misses (S04)

    # Voxel downsampling
    # Leaf size for voxel grid downsampling (metres).
    # Larger = faster but misses small objects.
    voxel_leaf_m: 0.02   # 0.05 m voxels are coarser than the 80 mm ball and collapse it to 1-2 points; 0.02 m resolves ~10-20.

    # Background model / frame differencing
    # Persistent voxel-hashed background map in the fixed frame, replacing the
    # rolling deque below. The deque only remembers 0.267 s, so terrain the
    # camera newly sees while patrolling reads as novel, fg floods to ~48k
    # points, and the ball is absorbed into a metre-scale cluster. Set false to
    # A/B against the Week 3 deque, which is what the Week 3 recall figures were
    # scored on. Ignored in camera mode (pre-b0eedd5 bags): a persistent map
    # needs a fixed frame, so those runs always use the deque.
    use_persistent_bg: true
    bg_map_leaf_m: 0.10       # keep equal to diff_threshold_m — see background_map.py
    bg_map_ttl_s: 20.0        # forget a voxel unseen this long (bounds a drifting map)
    bg_map_max_voxels: 400000 # hard size cap; oldest-seen voxels evicted first

    # Number of past frames to keep in the rolling background buffer
    # (only used when use_persistent_bg is false, or in camera mode).
    bg_history_frames: 5

    # Minimum per-voxel depth change (metres) to count as "foreground".
    diff_threshold_m: 0.10   # 0.15 missed fast/oblique closes (S03,S06,S08) — lowered sensitivity floor

    # Skip the frame entirely if more foreground points than this survive
    # differencing: whole-scene change = egomotion flood (patrol turn), not a
    # projectile. Also bounds clustering cost.
    fg_max_points: 5000

    # Euclidean clustering
    # Points within this radius (metres) are merged into the same cluster.
    cluster_tolerance_m: 0.20

    # Reject clusters outside this size range (number of voxel-downsampled
    # points). cluster_max_points applies only AFTER extent splitting; applying
    # it first discarded the ball whenever it merged into a larger blob.
    cluster_min_points: 5     # raised 3->5 — 3 let background clutter through as FPs (N01, N03)
    cluster_max_points: 500

    # Extent splitting: a cluster larger than cluster_max_extent_m is
    # re-clustered ONCE at this tighter radius instead of being dropped, so a
    # ball touching a surface stays separable. Keep it above voxel_leaf_m and
    # below the ball's standoff from the scene — recursive shrinking shatters a
    # surface into ball-sized false positives once the radius reaches its own
    # point spacing (29 fragments in the unit test). max_points bounds the cost:
    # a bigger blob is an egomotion flood, which is fg_max_points' job.
    cluster_split_tol_m: 0.10
    cluster_split_max_points: 5000

    # Reject clusters whose max axis extent exceeds this (metres). The 80 mm
    # ball spans <= ~0.15 m after 0.02 m voxelization; scene-entry blobs (near
    # ground/wall patches entering the ROI, fg==voxel) span metres. This is the
    # primary FP gate against those, where a point-count cut does not reach.
    cluster_max_extent_m: 0.35

    # It does not separate the patrol-motion false-positive class, though:
    # over T01-T14, true-ball clusters span 0.03-0.34 m / 5-73 pts and those
    # false positives span 0.08-0.21 m / 6-43 pts — entirely inside. The cause
    # is the persistent background map, which can only flag a voxel foreground
    # the first time the translating camera sees it, so newly-explored terrain
    # reads as a genuine foreground burst over the first ~1-2 s of a leg. No
    # single-frame extent/size/score cut separates the two without also cutting
    # faint real detections; the discriminator is cross-frame persistence
    # (evasion_node's min_track_updates), which score_bags cannot exercise.
    # Recall measured on this library is therefore a window statistic, not a
    # detection claim — see docs/KNOWN_ISSUES.md.

    # Centroid publishing
    # Minimum confidence score [0–1] to publish a centroid.
    # (Score = normalised cluster size; keeps the largest coherent blob.)
    min_publish_score: 0.006  # ~3 pts; let cluster_min_points be the size floor, not the score gate.

    # Output topic
    threat_centroid_topic: "/threat/centroid"
    marker_topic: "/threat/marker"

    # Egomotion compensation
    # Fold /huitzilin/odom into TF and difference clouds in the fixed frame
    # below instead of the moving camera frame. Requires odom with a valid
    # orientation quaternion (bags recorded from b0eedd5 onward); bags without
    # it fall back to camera-frame differencing, which floods under patrol
    # motion and was the cause of the 60%-recall regression.
    # Set false to disable (useful for debugging the raw differencer).
    compensate_egomotion: true
    odom_topic: "/huitzilin/odom"
    fixed_frame: "odom"
