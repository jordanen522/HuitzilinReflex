# detector.yaml
# All detection thresholds for detector_node.py.
# Tune against the bag library; commit the sweep that justifies any change.
# The library is saturated (recall 100%) — it can no longer referee threshold
# changes, and every trigger-side lever is a measured null (CLAUDE.md).
#
# NO magic numbers in detector_node.py — every tunable lives here.

detector:
  ros__parameters:

    # W4 live bring-up diagnostic (2026-07-24): live runs produce zero
    # /threat/centroid while /oak/points streams fine — Week 3 was only ever
    # scored against bags, never live. This logs per-stage survivor counts
    # (raw -> range -> angle -> voxel -> fg -> clusters -> ball_sized -> score).
    # Note: detector_node caches params at construction and has no set-param
    # callback, so this cannot be flipped with `ros2 param set` — it must be
    # set here and the node restarted. Revert to false once live detection
    # is confirmed; it is chatty (throttled to ~1 Hz per stage).
    # Reverted to false 2026-07-27 (live detection confirmed; the persistent
    # background map closed the patrol blindness). Set true again only while
    # diagnosing a specific throw's survivor counts.
    #
    # It is NOT the latency problem, contrary to what was assumed when profiling
    # started. Its min/max block does run six reductions over the full
    # ~200k-point cloud before the range gate discards most of it, but measured
    # as its own stage (funnel_log_minmax) at throttle 0.0 that costs only
    # 1.4-2.3 ms/frame — 4-5% of the frame. The ~160 ms figure was the cost of a
    # PUBLISHING frame, and it was voxel (66-74 ms) plus cluster (30-70 ms).
    debug_funnel: false
    debug_funnel_throttle_s: 1.0

    # ── Per-stage latency profiling (W4, 2026-07-27) ──────────────────────────
    # Dodge latency was root-caused to detector COMPUTE, not transport: clouds
    # arrive every ~77 ms wall (15 Hz at the measured RTF 0.864) and _cloud_cb
    # was taking ~160 ms, so the depth-5 queue backs up and every cloud is stale
    # on arrival. Transport is the symptom. This logs a wall-time breakdown per
    # stage (hottest first) every profile_window_frames clouds, so the
    # optimisation targets the measured hot stage instead of a guess.
    # Deliberately independent of debug_funnel — leave that false while
    # profiling. Same restart caveat as debug_funnel: params are cached at
    # construction, so `ros2 param set` has no effect.
    # Off after the 2026-07-27 measurement: voxel_downsample (66-74 -> 5-17 ms)
    # and cluster_all (12-71 -> 2-20 ms) were the whole overrun, and every frame
    # now fits the budget (14-55 ms). Turn it on again before changing anything
    # in the callback -- it is how those two were found.
    profile_stages: false
    profile_window_frames: 30

    # ── Per-frame dump (W4, 2026-07-27) ───────────────────────────────────────
    # Set to a directory to write one .npz per cloud frame: the post-voxel,
    # egomotion-compensated cloud, its foreground mask, every cluster the
    # splitter produced, and the publish decision.
    #
    # Why this exists when the funnel log does not suffice: the funnel reports
    # survivor COUNTS, which cannot attribute a miss. A frame with 40 foreground
    # points and no ball-sized cluster reads identically whether the background
    # map absorbed the ball or the ball merely fell under cluster_min_points.
    # With the cloud and the mask on disk, and the ball's true pose known from
    # /gz/dynamic_poses, the attribution is exact — that is the measurement the
    # detection-consistency gap (~1.7 m detected then discarded) needs.
    #
    # Costs latency and ~250 KB/frame at 15 Hz. Empty string = off, and it must
    # be left off: added latency drops frames, which corrupts the very
    # consistency it is measuring.
    debug_dump_dir: ""

    # ── Cloud transport (W4 live bring-up, 2026-07-26) ────────────────────────
    # /oak/points is a 7.37 MB sample; BEST_EFFORT lost ~75% of it to UDP
    # fragmentation (measured: best_effort 3.99 Hz vs reliable 14.43 Hz on the
    # same topic; the detector itself was down to 1.25 Hz). At that rate a ball
    # is seen once per throw and no dodge can ever trigger. Set cloud_reliable
    # false on real hardware, where DepthAI publishes best-effort.
    cloud_reliable: true
    cloud_queue_depth: 5

    # ── Input cloud axis convention ───────────────────────────────────
    # gz-sim PointCloudPacked stays in the gz sensor body frame (X fwd, Y left,
    # Z up); <optical_frame_id> renames the header only. "gz_flu" remaps points
    # to REP-103 optical at ingest. Set "optical" for a real OAK-D (DepthAI
    # already outputs optical-convention clouds).
    cloud_convention: "gz_flu"

    # ── ROI / range gate ──────────────────────────────────────────────
    # Keep only points within this depth range (metres).
    # Reliable OAK-D Lite working band; clip edges that are too noisy.
    roi_min_range_m: 0.30
    roi_max_range_m: 5.00   # 8.0 let far background (12-19m) dominate the diff — hover attitude
                             # jitter x long range >> diff_threshold there, flooding fg every frame
                             # (S02 funnel: fg=25k-90k, clusters=0). Tried 6.5 to rescue S08 (14 m/s,
                             # offset_forward_m=6.0) but that regressed S03 and STILL didn't fix S08
                             # (90%->80% recall) — S08's failure isn't a range/dwell issue after all.
                             # Reverting to 5.0 (best measured train recall: 90%, TP=9/FN=1) and
                             # moving to the held-out test split; S08 stays a known FN.

    # Forward half-angle of the ROI frustum (degrees).
    # Points outside this cone ahead of the camera are discarded.
    roi_half_angle_deg: 45.0   # widened 40->45 for oblique misses (S04)

    # ── Voxel downsampling ────────────────────────────────────────────
    # Leaf size for voxel grid downsampling (metres).
    # Larger = faster but misses small objects.
    voxel_leaf_m: 0.02   # 0.05 m voxels are COARSER than the 80 mm projectile -> it collapsed to 1-2 pts. 0.02 m resolves it into ~10-20 pts.

    # ── Background model / frame differencing ────────────────────────────────
    # Persistent voxel-hashed background map in the fixed frame, replacing the
    # rolling deque below. Root cause it fixes (measured 2026-07-26): the deque
    # only remembers 0.267 s, so scene the camera newly sees while patrolling
    # reads as novel, fg floods to ~48k points, and the ball is absorbed into a
    # metre-scale cluster — every on-target patrol throw gave 0-1 centroids
    # against a min_track_updates=3 gate. Set false to A/B against the Week-3
    # deque (which is what the recorded W3 recall figures were scored on).
    # Ignored in camera mode (pre-b0eedd5 bags): a persistent map needs a fixed
    # frame, so those runs always use the deque.
    use_persistent_bg: true
    bg_map_leaf_m: 0.10       # keep equal to diff_threshold_m — see background_map.py
    bg_map_ttl_s: 20.0        # forget a voxel unseen this long (bounds a drifting map)
    bg_map_max_voxels: 400000 # hard size cap; oldest-seen voxels evicted first

    # Number of past frames to keep in the rolling background buffer
    # (only used when use_persistent_bg is false, or in camera mode).
    bg_history_frames: 5

    # Minimum per-voxel depth change (metres) to count as "foreground".
    diff_threshold_m: 0.10   # 0.15 missed fast/oblique closes (S03,S06,S08) — lowered sensitivity floor

    # Skip the frame entirely if more foreground points than this survive
    # differencing: whole-scene change = egomotion flood (patrol turn), not a
    # projectile. Also bounds clustering cost.
    fg_max_points: 5000

    # ── Euclidean clustering ──────────────────────────────────────────
    # Points within this radius (metres) are merged into the same cluster.
    cluster_tolerance_m: 0.20

    # Reject clusters outside this size range (number of voxel-downsampled points).
    # W4: cluster_max_points now applies only AFTER extent splitting. Applying it
    # first discarded the ball whenever it merged into a larger blob.
    cluster_min_points: 5     # raised 3->5 — 3 was letting background clutter FP (N01, N03) through
    cluster_max_points: 500

    # Extent splitting (W4): a cluster larger than cluster_max_extent_m is
    # re-clustered ONCE at this tighter radius instead of being dropped, so a
    # ball touching a surface stays separable. Keep it above voxel_leaf_m and
    # below the ball's standoff from the scene: recursive shrinking was tried
    # first and shatters a surface into ball-sized false positives once the
    # radius reaches its own point spacing (29 fragments in the unit test).
    # max_points bounds the cost — a bigger blob is an egomotion flood, which is
    # fg_max_points' job, not a scene object worth splitting.
    cluster_split_tol_m: 0.10
    cluster_split_max_points: 5000

    # Reject clusters whose max axis extent exceeds this (metres). The 80 mm
    # ball spans <= ~0.15 m after 0.02 m voxelization; scene-entry blobs (near
    # ground/wall patches entering the ROI, fg==voxel) span metres. This is the
    # primary FP gate — point-count ranges overlap, metric size does not.
    cluster_max_extent_m: 0.35

    # ###################################################################
    # INVALIDATED 2026-08-17, THE SAME DAY IT WAS WRITTEN. DO NOT CITE THE
    # NUMBERS IN THE BLOCK BELOW. They came from replays that scored a
    # RECORDED /threat/centroid track instead of the detector under test,
    # so they measure the wrong detector.
    #
    # Task 4 captured the T-bags with a live perception stack running, so
    # each T-bag CONTAINS that stack's own /threat/centroid output --
    # T01-T10 carry 75-99 messages, T11 1, T12 31, T13 0, T14 99 -- and
    # score_bags._replay_bag passes no --exclude-topics, so `ros2 bag play`
    # republishes them and _centroid_cb counts them as detections of the
    # detector under test. Proven empirically, not just by reading the code:
    # replaying T14's /threat/centroid with NO detector running delivers
    # exactly 99 messages to a RELIABLE subscriber (the bag records the topic
    # with offered reliability=reliable, so it is QoS-compatible).
    #
    # Do NOT try to recover the old numbers by subtracting the recorded count
    # from the buggy total. That subtraction was tried and is unsound: it
    # predicts 8 live FPs on T14, while the fixed harness measures 97. The
    # leading explanation is message loss -- two publishers bursting into one
    # depth-limited RELIABLE queue -- but that mechanism is a HYPOTHESIS and
    # has not been verified; a plainer rival is that FP counts are
    # throughput-sensitive (cloud_queue_depth: 5, below) and the contaminated
    # and clean runs carried different loads. Either way a contaminated total
    # is not the sum of anything: measure, never subtract. The trustworthy
    # counts are the ones measured with the recorded track excluded, on the
    # Dell, at that load (tune: T11 0, T12 35, T13 0, T14 97).
    #
    # Also corrected: an earlier revision of this header claimed T05 and T10
    # were scored TP while the detector published nothing, i.e. two hidden
    # false negatives. That was wrong -- under the fixed harness both pass
    # the anchored window. The MECHANISM that produced the false claim was
    # never established: a later revision of this block attributed it to a
    # funnel log read at debug_funnel_throttle_s: 1.0, but nothing in the
    # code, the diff or the Task 5b report substantiates that, and the only
    # account of the incident that exists names two different candidates --
    # the missing SPAWN_LEAD_S anchor and the `ros2 bag play --clock`
    # wall-clock-synthesis trap, each of which independently produces the
    # symptom "the detector looks like it published nothing near the
    # expected time". Recorded here as unresolved rather than guessed.
    #
    # Two claims below DO survive, both re-checked against the code:
    #  - bg_query genuinely reports first-sight terrain as foreground
    #    (background_map.py foreground(): a point is foreground only when
    #    its own voxel and all 26 neighbours are unobserved).
    #  - the ball/terrain geometric overlap is directionally real, but the
    #    quoted ranges are not: a funnel line lists EVERY ball-sized
    #    cluster in a frame, not the ball, so the "TP population" above
    #    already contains the FP class it is compared against. Attribution
    #    cannot use debug_dump_dir's cl_centroid against /gz/dynamic_poses:
    #    the bags do not record that topic.
    #
    # RETRACTED 2026-08-17 (Task 5c): this block used to end "Task 5b
    # attributes instead by requiring a run of >=3 in-window detections of
    # strictly decreasing range -- a closing ball -- which terrain noise
    # does not produce." That last clause is FALSE, and it is refuted 25
    # lines below by this file's own account of the FP mechanism. A run of
    # strictly decreasing base_link range is exactly what a patrolling drone
    # translating TOWARD newly-explored static terrain produces, frame after
    # frame. A sign-only test therefore selects FOR this library's dominant
    # FP class, and over 200 000 iid-noise trials per point it fires at
    # P=0.77 (n=10), 0.91 (n=15), 0.97 (n=20) detections in the window --
    # which is where the "11 of 12 attributable" figure came from. The
    # replacement uses the closure RATE the sign test discarded: a run only
    # counts when every step closes faster than the airframe's own measured
    # rolling-max ground speed (3.49 m/s) and no faster than that scenario's
    # ball speed plus the same figure. See score_bags_logic
    # .attribute_closing_ball. Do not re-derive any attribution claim from
    # a run length alone.
    #
    # AND THE REPLACEMENT IS ITSELF REFUTED, by the falsification control
    # Task 5b structurally could not run. Measured 2026-08-17 over every
    # negative in the library, whole replay, against the most permissive
    # band any scenario gets.
    #
    # THERE ARE TWO KINDS OF NEGATIVE IN THIS LIBRARY AND ONLY ONE OF THEM
    # IS A NULL CONTROL. Corrected 2026-08-17 (Task 5c fix round 1): an
    # earlier version of this block called N03 and T12 "ball-free". They
    # are not. scenario_matrix.yaml gives N03 speed_mps 8.0 (spawned behind
    # the camera), N04 8.0 (~10 m below), T12 11.0 (behind), T13 11.0
    # (below) -- a projectile IS spawned in all four. They are negatives in
    # the sense of "wrong bearing, wrong elevation, the gates must suppress
    # it", not "contains no ball". The genuinely ball-free bags are the
    # five with speed_mps 0.0, where capture_scenario.sh issues no spawn
    # command at all: N01, N02, N05, T11, T14.
    #
    # ON THE GENUINELY BALL-FREE SUBSET: of the three that emit any
    # centroid at all -- N01 (30 FPs), N02 (36), N05 (22) -- ALL THREE
    # yield a qualifying in-band closing run and falsely attribute a ball.
    # 3 of 3. T11 emits nothing; T14 emits 97 detections and does not fire.
    # N01's firing run is three detections spanning 0.462 s at ~4.5 m/s, in
    # a bag with no projectile in it. (Re-measured 2026-08-17 under the
    # corrected window; the FP counts drift by 1-2 per bag between runs, as
    # the throughput note further down predicts. Every verdict reproduced.)
    # And state the n rather than hiding it behind "9 negatives": the
    # ball-free control is THREE emitting bags, all three from the
    # originals' negatives. T11 and T14, the tune set's two ball-free bags,
    # do not fire. It is a small control; it is also unanimous on every bag
    # that produces any data.
    # ON THE BALL-PRESENT MUST-NOT-DETECT SUBSET, reported separately
    # because it is a different and weaker fact: N03 fires, T12 fires, N04
    # emits nothing, T13 emits nothing. Interesting, not a null result --
    # there is a real ball in those bags.
    # Meanwhile 0 of the 12 original positives and 1 of the 10 tune
    # positives qualify, and that one (T03) fires 1.3 s after its 17 m/s
    # ball has left the frame, at 7.7 m/s.
    # THERE IS NO WORKING OFFLINE ATTRIBUTION IN THIS HARNESS.
    #
    # HOW STRONG THE REFUTATION IS, stated precisely, because the earlier
    # version of this block overstated it in two directions at once:
    #  - AS A WHOLE-BAG TEST it is refuted outright. That is the criterion
    #    the task set, the control (ctl_all, the whole replay) meets it
    #    literally, and no attribution claim survives it.
    #  - THE CONTROL IS NOT WINDOW-MATCHED. N01's firing run sits at
    #    bag_start+0.365..0.827 s, entirely PRE-SPAWN, inside exactly the
    #    region the scoring window's spawn floor removes from every
    #    positive. The matched control (ctl_win) reads 0 of 5, identical to
    #    the positives' 0 of 12. Inside the scored window the statistic is
    #    INERT AND UNDERPOWERED at these n, which is a weaker and different
    #    statement from "wrong". Both are true; do not quote one as the
    #    other.
    #  - "0 of 12 positives is below the noise floor" is fair: the null
    #    model puts the per-scenario spurious-attribution rate at 0.10-0.36
    #    over the measured in-window counts. But P(0 of 12 | null) ~= 0.12,
    #    so an earlier claim here that "there is no closing-ball signal in
    #    the in-window centroid stream at all" is NOT supported and has
    #    been removed. The error was conservative -- it under-claimed the
    #    detector -- but it was still an error.
    #    The null model behind those numbers ships and is re-runnable:
    #    src/huitzilin_perception/test/null_attribution_mc.py.
    #
    # Mechanism, so the next attempt does not repeat it: successive
    # /threat/centroid messages in this library are not one object tracked
    # frame to frame. They are unrelated terrain patches at unrelated
    # depths, so their apparent closure rate is arbitrary and lands inside
    # any physically plausible band often enough to be useless. Range alone
    # cannot establish object identity between frames. The next thing to
    # try is the full base_link (x, y, z) the centroid already carries --
    # bound the 3-D step displacement, not just the radial one -- but that
    # is untested and must be validated on the tune split and against this
    # same negative control BEFORE any attribution claim is made from it.
    #
    # Until then: a /threat/centroid inside the detection window is
    # evidence that the detector fired near the right time, and nothing
    # more. It is NOT evidence that the ball was detected. Recall measured
    # on this library is a window statistic.
    #
    # AND THE WINDOW STATISTIC IS NOT A DETECTION CLAIM EITHER, from this
    # file's own emitted numbers. In-window centroid DENSITY (n_win per
    # second of window, corrected-window run of 2026-08-17): the ball-free
    # N02 carries 4.00/s, which is higher than TEN of the twelve original
    # positives (1.14-3.79/s; only S04 at 4.17 and S10 at 4.55 exceed it).
    # A statistic that a ball-free bag reproduces is not evidence of
    # detection, whatever its numerator reads. The one hint pointing the
    # other way, and it is only a hint: the median positive density
    # (1.95/s) is about 2x the negatives' median (1.00/s) -- weak, not
    # significant at n = 5 negatives, and NOT promotable to a detection
    # claim. It needs more ball-free bags, not another discriminator.
    #
    # Refinement worth carrying into the re-measurement: the driver is
    # most likely a COLD map at every replay start, not steady sweeping.
    # insert() clears the map when stamps go backwards, so each replay
    # starts empty and warms up. A live flight pays that warm-up once at
    # takeoff; per-bag scoring pays it 31 times. Task 5b's per-frame funnel
    # confirms the scale is far worse than the block below says: frames of
    # bg=506 fg=4892 and bg=1013 fg=4159 -- both just UNDER the current
    # fg_max_points: 5000 -- pass through and yield ball-sized clusters
    # (best=7, extent=0.21 m). So fg_max_points is the live candidate lever.
    # It is NOT yet safe to lower: nobody has checked whether a true
    # acquisition frame also spikes into that range, and cutting one would
    # cost real detections. That check needs its own tune-split runs.
    #
    # Re-score with the recorded topic excluded BEFORE deriving anything
    # from this block. Note FP counts are also throughput-sensitive
    # (cloud_queue_depth: 5 drops clouds under load), so an FP count is only
    # comparable against another run on a comparably loaded machine.
    # ###################################################################
    # Investigated 2026-08-17 (Task 5, Step 0/2): T11/T12/T14 (patrol-motion
    # tune negatives) produced FP clusters through this exact gate -- e.g.
    # (size=43, extent=0.20 m) and (size=25, extent=0.21 m) from T14 -- so the
    # claim above ("metric size does not [overlap]") does not hold for this FP
    # class. Root cause: the persistent background map (bg_query stage) can
    # only flag a voxel foreground the FIRST time the translating camera sees
    # it, so newly-explored static terrain along a patrol leg reads as a
    # genuine (not smeared) foreground burst, concentrated in the first ~1-2 s
    # of a scenario's own flight path (T14: bg=10643->19584 voxels over the
    # bag, and its FPs land only in the first 1.4 s of a 45 s replay).
    # Measured against every T01-T14 funnel line: TP cluster extent spans
    # 0.03-0.34 m and size spans 5-73 pts; this FP class's extent
    # (0.08-0.21 m) and size (6-43 pts) sit entirely inside that range. No
    # single-frame extent/size/score cut in this file separates them without
    # also cutting real (if faint) tune-set detections, so none was made --
    # the tune split shows 0 FN with the thresholds below, and this repo's own
    # tuning rule is no change without a tune-split FN or FP that justifies
    # it. Discriminating "just-mapped rock" from "ball" needs cross-frame
    # persistence (evasion_node's min_track_updates), not a per-cloud gate;
    # score_bags only scores the raw per-cloud /threat/centroid stream, so
    # that fix cannot move this harness's numbers even though it is the
    # right fix for the live dodge decision. TF_OLD_DATA staleness (odom TF
    # going stale under patrol motion) was checked and ruled OUT as the
    # driver: it appears throughout the tune library, including 187 times in
    # T13 (the near-zero-FP scenario), and does not track FP severity (T11
    # logs 2x T12's TF warnings but produces 1/36th its FP count).

    # ── Centroid publishing ───────────────────────────────────────────
    # Minimum confidence score [0–1] to publish a centroid.
    # (Score = normalised cluster size; keeps the largest coherent blob.)
    min_publish_score: 0.006  # ~3 pts; let cluster_min_points be the size floor, not the score gate.

    # ── Output topic ──────────────────────────────────────────────────────────
    threat_centroid_topic: "/threat/centroid"
    marker_topic: "/threat/marker"

    # ── Egomotion compensation ────────────────────────────────────────
    # Fold /huitzilin/odom into TF and difference clouds in the fixed frame
    # below instead of the moving camera frame. Requires odom with a valid
    # orientation quaternion (mav_bridge ≥ the 2026-07-06 attitude fix);
    # bags without it fall back to camera-frame differencing, which floods
    # under patrol motion and was the cause of the 60%-recall regression.
    # Set false to disable (useful for debugging the raw differencer).
    compensate_egomotion: true
    odom_topic: "/huitzilin/odom"
    fixed_frame: "odom"
