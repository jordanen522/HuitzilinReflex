# hw_bridge.yaml - mav_bridge overlay for the real H743.
#
# Loaded after bridge.yaml by hardware.launch.py; keys here win. A separate
# file, never an edit to bridge.yaml: --symlink-install makes the installed
# copy a symlink into src/, so editing the shipped yaml edits the real config.
#
# There is no connection key. mavlink-router (hardware/mavlink-router.conf)
# owns the serial port and forwards to bridge.yaml's udpin:0.0.0.0:14552, the
# same port SITL's --out feeds, because patrol needs a second link to the same
# flight controller and a serial port cannot be opened twice.

mav_bridge:
  ros__parameters:
    cmd_rate_hz: 10.0

    # cmd_timeout_s and evasion.yaml's patrol_handoff_s (0.8) are coupled:
    # handoff MUST stay greater than this timeout, or the zero-velocity
    # handback fights patrol's position setpoints. If either moves on
    # hardware, both move. test_hw_config.py asserts the inequality.
    cmd_timeout_s: 0.7

    takeoff_alt_m: 2.0

    # Not settled: the justification for outpacing the cloud is that odom
    # must beat the depth rate for egomotion compensation, and that rate was
    # 15 Hz only because ros_gz_bridge could not sustain more. If the real
    # camera delivers faster, 30 no longer satisfies its own reason and must
    # rise. Do not treat this number as settled.
    stream_rate_hz: 30.0

    mode: "GUIDED"
