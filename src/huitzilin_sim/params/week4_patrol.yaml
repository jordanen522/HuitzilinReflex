# Patrol geometry for the dodge battery ONLY. Same node and parameters as
# patrol.yaml, bigger loop. patrol.yaml keeps the 5 m square because that is the
# Week 2 demo geometry.
#
# WHY 12 m LEGS: throws are only aimable on the steady middle of a leg (see
# throw_window.py). Measured cruise is 3.4 m/s max (median 2.09) — NOT the
# cruise_speed_ms below, which position mode ignores. A 5 m loop therefore
# leaves at most (5.0 - 0.6) / 3.4 = 1.29 s of straight leg, less than B01
# needs (1.80 s), so B01 is structurally unmeasurable there. 12 m legs give
# 3.35 s; minus the accel/decel ramps (WPNAV_ACCEL 2.5 m/s^2 => ~2.3 m each)
# that is ~2.7 s of genuinely constant-velocity flight.
#
# Bounds if this loop is ever grown: the world ground plane is 200x200 m, and
# the detector's background map scales with loop perimeter — 77.5k voxels on the
# 5 m loop, ~190k here, against a 400k cap.

patrol:
  ros__parameters:
    # 12 m x 12 m square loop at 2 m altitude (d = -2.0).
    waypoints_ned: [12.0,  0.0, -2.0,
                    12.0, 12.0, -2.0,
                     0.0, 12.0, -2.0,
                     0.0,  0.0, -2.0]
    accept_radius_m: 0.6
    cruise_speed_ms: 1.5    # ignored in position mode (ArduPilot WPNAV_SPEED wins)
    mode: "position"
    loop: true
    autostart: false        # start via /huitzilin/start_patrol AFTER takeoff;
                            # autostarting floods GUIDED during takeoff and the
                            # drone never leaves the ground
    connection: "udpin:0.0.0.0:14553"   # patrol node needs its own port
