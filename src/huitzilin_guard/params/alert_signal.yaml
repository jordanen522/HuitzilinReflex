# alert_signal.yaml -- the warning-light and siren output for the alert.
#
# backend:
#   sim  - publish /guard/alarm_state and log. The default, and on any
#          machine without the deferred GPIO arbitration the only correct
#          value.
#   none - inert, for a dev box that should not even log.
#   hardware - REFUSED, deliberately. payload_node already owns the WS2812B
#          data line (SPI0, GPIO 10) and the siren line (GPIO 17), and
#          Linux GPIO line requests are exclusive, so a second process taking
#          those lines would silently stop the PROJECTILE alarm from firing.
#          Selecting it logs the refusal and runs inert rather than raising:
#          SAFETY_CASE.md section 1 rates a payload fault log-and-continue.
#          See docs/guard.md for the arbitration that would have
#          to land first.

alert_signal:
  ros__parameters:
    alert_topic: "/guard/alarm_request"
    state_topic: "/guard/alarm_state"
    backend: "sim"

    # A lone True must still produce a signal a person can see and hear.
    min_on_s: 2.0
    # Dead-man. The guard publishes a clear, but it may die first. Must
    # EXCEED the guard's max_alert_s (300 s) or the two race: this node
    # would silence the siren while the guard still believed it was
    # sounding, and because the guard publishes a level rather than a
    # repeated edge, nothing would ever turn it back on.
    max_on_s: 310.0
    # Silence means the publisher is gone; it is not consent to keep running.
    stale_off_s: 3.0
    tick_hz: 10.0
