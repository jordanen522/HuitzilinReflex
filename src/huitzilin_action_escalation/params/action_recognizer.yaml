# action_recognizer.yaml -- aggressive-action scoring and the alert policy.
#
# Every threshold here is an engineering starting point chosen to sit above
# ordinary movement. NONE of them is fitted to labelled data, and no measured
# false-positive or false-negative rate exists for any value in this file.
# See docs/action_escalation.md before quoting any of it as performance.
#
# This node drives lights and a siren. It has no flight output of any kind.
#
# There is no hw_ overlay for this file yet, and that is not an oversight:
# the hardware alert path is unresolved (see alert_signal.yaml), so there is
# no hardware configuration to overlay.

action_recognizer:
  ros__parameters:
    keypoints_topic: "/action/keypoints"

    # Feature window. Long enough to span a strike, short enough that a
    # finished action leaves before the next begins.
    window_s: 0.6
    # Joints below this are treated as absent. A pose estimator reports a
    # confidence for an occluded limb rather than omitting it, and a
    # hallucinated wrist moves fast.
    min_joint_conf: 0.35

    # Confirmation. enter_score must exceed exit_score or the hysteresis gap
    # inverts and the alert chatters.
    enter_score: 0.70
    exit_score: 0.45
    min_confirm_frames: 4
    confirm_window_s: 0.6

    # A lone confirmation must still produce a perceptible signal.
    min_alert_s: 2.0
    # Dead-man, so a stuck-high scorer cannot latch the alert indefinitely.
    max_alert_s: 10.0
    # One incident should be one alert, not a burst.
    cooldown_s: 15.0
    # No NEW frame for this long is a fault, not a quiet scene. Must exceed
    # several tick periods or a momentary gap reads as a dropout.
    stale_input_s: 2.0

    tick_hz: 10.0
    status_period_s: 1.0

    # Per-frame diagnostic output, off by default. The projectile lane
    # already carries the lesson that a debug path left on costs more than it
    # is worth (debug_dump_dir, ~40 ms/frame); this one republishes the input
    # at input rate.
    publish_observations: false

    # No raw video, no images, no crops, ever written by this node. Present
    # as an explicit key so the default is visible in config and in the
    # status heartbeat, rather than only asserted in a document.
    record_video: false
