# ambiguous_approach.yaml -- NEGATIVE CONTROL. Must never confirm.
#
# The most important scenario in the set, and the only one whose failure
# would be interesting. Someone walking briskly straight at the aircraft with
# a normal arm swing: closing fast enough to satisfy the approach term of
# both LUNGE and SHOVE on its own.
#
# It must not confirm, because approach speed alone is not aggression. LUNGE
# additionally requires the torso to pitch over, which walking does not do,
# and SHOVE additionally requires both arms driving forward together, which
# an alternating arm swing is the opposite of.
#
# The torso is given a small natural sway rather than being held perfectly
# rigid, so the lean term is genuinely non-zero and below threshold rather
# than trivially zero. A control that passes because a feature is identically
# zero is not testing the threshold.
#
# If a threshold change ever makes this scenario confirm, the change is wrong
# no matter what it did to the three positive scenarios.

name: ambiguous_approach
description: Brisk walk directly toward the camera with a normal arm swing.
expect: no_confirm
rate_hz: 15.0

base:
  shoulder_l: [-0.20, -0.50, 4.00, 0.95]
  shoulder_r: [0.20, -0.50, 4.00, 0.95]
  elbow_l: [-0.25, -0.22, 3.98, 0.90]
  elbow_r: [0.25, -0.22, 3.98, 0.90]
  wrist_l: [-0.28, 0.05, 3.96, 0.88]
  wrist_r: [0.28, 0.05, 3.96, 0.88]
  hip_l: [-0.15, 0.00, 4.00, 0.93]
  hip_r: [0.15, 0.00, 4.00, 0.93]
  knee_l: [-0.16, 0.45, 4.00, 0.90]
  knee_r: [0.16, 0.45, 4.00, 0.90]
  ankle_l: [-0.17, 0.90, 4.00, 0.88]
  ankle_r: [0.17, 0.90, 4.00, 0.88]

keyframes:
  - t_s: 0.0
    all: [0.0, 0.0, 0.0, 0.0]

  # 1.6 m/s closing -- past the SHOVE approach ramp entirely, and well into
  # the LUNGE approach ramp. Arms swing in opposite phase.
  - t_s: 0.5
    all: [0.0, 0.0, -0.80, 0.0]
    offsets:
      shoulder_l: [0.0, 0.0, -0.05, 0.0]
      shoulder_r: [0.0, 0.0, -0.05, 0.0]
      wrist_l: [0.0, 0.0, -0.20, 0.0]
      wrist_r: [0.0, 0.0, 0.20, 0.0]
      elbow_l: [0.0, 0.0, -0.10, 0.0]
      elbow_r: [0.0, 0.0, 0.10, 0.0]

  - t_s: 1.0
    all: [0.0, 0.0, -1.60, 0.0]
    offsets:
      wrist_l: [0.0, 0.0, 0.20, 0.0]
      wrist_r: [0.0, 0.0, -0.20, 0.0]
      elbow_l: [0.0, 0.0, 0.10, 0.0]
      elbow_r: [0.0, 0.0, -0.10, 0.0]

  - t_s: 1.5
    all: [0.0, 0.0, -2.40, 0.0]
    offsets:
      shoulder_l: [0.0, 0.0, -0.05, 0.0]
      shoulder_r: [0.0, 0.0, -0.05, 0.0]
      wrist_l: [0.0, 0.0, -0.20, 0.0]
      wrist_r: [0.0, 0.0, 0.20, 0.0]
      elbow_l: [0.0, 0.0, -0.10, 0.0]
      elbow_r: [0.0, 0.0, 0.10, 0.0]
