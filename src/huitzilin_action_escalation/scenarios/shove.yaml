# shove.yaml -- both arms driving forward together while stepping in.
#
# Hand-authored against the same thresholds it is checked with, so this
# passing is not a recall figure. See scenario.py.
#
# The bilateral term takes the MINIMUM of the two arms, so this is the only
# scenario in the set that can satisfy it. A one-armed version is a strike.

name: shove
description: Two-handed forward push with a closing step.
expect: confirm
rate_hz: 15.0

base:
  shoulder_l: [-0.20, -0.50, 4.00, 0.95]
  shoulder_r: [0.20, -0.50, 4.00, 0.95]
  elbow_l: [-0.25, -0.22, 3.98, 0.90]
  elbow_r: [0.25, -0.22, 3.98, 0.90]
  wrist_l: [-0.28, 0.05, 3.96, 0.88]
  wrist_r: [0.28, 0.05, 3.96, 0.88]
  hip_l: [-0.15, 0.00, 4.00, 0.93]
  hip_r: [0.15, 0.00, 4.00, 0.93]
  knee_l: [-0.16, 0.45, 4.00, 0.90]
  knee_r: [0.16, 0.45, 4.00, 0.90]
  ankle_l: [-0.17, 0.90, 4.00, 0.88]
  ankle_r: [0.17, 0.90, 4.00, 0.88]

keyframes:
  - t_s: 0.0
    all: [0.0, 0.0, 0.0, 0.0]

  # Both hands chambered at chest height, body 0.25 m closer (1.0 m/s).
  - t_s: 0.25
    all: [0.0, 0.0, -0.25, 0.0]
    offsets:
      wrist_l: [0.06, -0.50, -0.10, 0.0]
      wrist_r: [-0.06, -0.50, -0.10, 0.0]
      elbow_l: [0.03, -0.25, -0.05, 0.0]
      elbow_r: [-0.03, -0.25, -0.05, 0.0]

  # Both arms extend 0.65 m in 0.25 s (2.6 m/s each) while closing at
  # 1.2 m/s. Symmetric, so the minimum of the two sides is the full rate.
  - t_s: 0.5
    all: [0.0, 0.0, -0.55, 0.0]
    offsets:
      wrist_l: [0.08, -0.50, -0.75, 0.0]
      wrist_r: [-0.08, -0.50, -0.75, 0.0]
      elbow_l: [0.04, -0.28, -0.36, 0.0]
      elbow_r: [-0.04, -0.28, -0.36, 0.0]

  # Held so the peak stays in the window long enough to confirm.
  - t_s: 1.1
    all: [0.0, 0.0, -0.60, 0.0]
    offsets:
      wrist_l: [0.08, -0.50, -0.75, 0.0]
      wrist_r: [-0.08, -0.50, -0.75, 0.0]
      elbow_l: [0.04, -0.28, -0.36, 0.0]
      elbow_r: [-0.04, -0.28, -0.36, 0.0]
