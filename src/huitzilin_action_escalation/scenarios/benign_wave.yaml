# benign_wave.yaml -- NEGATIVE CONTROL. Must never confirm.
#
# Someone raising a hand and waving. This is the case the deleted
# RAISED_OBJECT category would have got wrong: from twelve body joints a
# raised hand holding a weapon and a raised hand hailing a taxi are the same
# signal, which is why that category is not in the set.
#
# It is also the check on conjunctive scoring. Wrist speed is genuinely high
# here -- higher than in some real strikes -- but the shoulder-to-wrist
# distance barely changes, because a wave moves an already-extended arm
# rather than opening it. Disjunctive scoring would fire on wrist speed
# alone.
#
# NOTE the t_s 0.15 keyframe. Without it the raise interpolates in a straight
# line from hip to overhead, which passes within 0.09 m of the shoulder --
# the shoulder-to-wrist distance collapses and re-opens, and the arm reads as
# a 3.3 m/s extension. That is an artefact of straight-line interpolation,
# not a wave: a real arm sweeps an arc at roughly constant radius and never
# passes through its own shoulder joint. The keyframe holds the radius at the
# ~0.55 m arm length through the raise. Removing it makes this scenario
# confirm, which is the whole reason it is written down here.

name: benign_wave
description: Stationary subject raising one hand and waving it side to side.
expect: no_confirm
rate_hz: 15.0

base:
  shoulder_l: [-0.20, -0.50, 4.00, 0.95]
  shoulder_r: [0.20, -0.50, 4.00, 0.95]
  elbow_l: [-0.25, -0.22, 3.98, 0.90]
  elbow_r: [0.25, -0.22, 3.98, 0.90]
  wrist_l: [-0.28, 0.05, 3.96, 0.88]
  wrist_r: [0.28, 0.05, 3.96, 0.88]
  hip_l: [-0.15, 0.00, 4.00, 0.93]
  hip_r: [0.15, 0.00, 4.00, 0.93]
  knee_l: [-0.16, 0.45, 4.00, 0.90]
  knee_r: [0.16, 0.45, 4.00, 0.90]
  ankle_l: [-0.17, 0.90, 4.00, 0.88]
  ankle_r: [0.17, 0.90, 4.00, 0.88]

keyframes:
  - t_s: 0.0
    all: [0.0, 0.0, 0.0, 0.0]

  # Mid-raise, arm out to the side at shoulder height, radius held at 0.55 m.
  - t_s: 0.15
    offsets:
      wrist_r: [0.47, -0.55, 0.0, 0.0]
      elbow_r: [0.25, -0.28, 0.0, 0.0]

  # Overhead.
  - t_s: 0.3
    offsets:
      wrist_r: [0.00, -1.05, 0.0, 0.0]
      elbow_r: [0.02, -0.55, 0.0, 0.0]

  - t_s: 0.5
    offsets:
      wrist_r: [0.25, -1.05, 0.0, 0.0]
      elbow_r: [0.13, -0.55, 0.0, 0.0]

  - t_s: 0.7
    offsets:
      wrist_r: [-0.25, -1.05, 0.0, 0.0]
      elbow_r: [-0.12, -0.55, 0.0, 0.0]

  - t_s: 0.9
    offsets:
      wrist_r: [0.25, -1.05, 0.0, 0.0]
      elbow_r: [0.13, -0.55, 0.0, 0.0]

  - t_s: 1.1
    offsets:
      wrist_r: [-0.25, -1.05, 0.0, 0.0]
      elbow_r: [-0.12, -0.55, 0.0, 0.0]
