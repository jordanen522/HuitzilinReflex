# lunge.yaml -- a body driving forward at the aircraft, torso pitching over.
#
# Hand-authored against the same thresholds it is checked with, so this
# passing is not a recall figure. See scenario.py.
#
# Frame: camera optical, +Z depth away from camera, +Y down, metres.
# The subject starts 4 m out, standing upright, and covers 2 m in 0.8 s
# while pitching the torso ~25 degrees forward over the first 0.3 s.

name: lunge
description: Fast closing approach with a pronounced forward torso pitch.
expect: confirm
rate_hz: 15.0

base:
  shoulder_l: [-0.20, -0.50, 4.00, 0.95]
  shoulder_r: [0.20, -0.50, 4.00, 0.95]
  elbow_l: [-0.25, -0.22, 3.98, 0.90]
  elbow_r: [0.25, -0.22, 3.98, 0.90]
  wrist_l: [-0.28, 0.05, 3.96, 0.88]
  wrist_r: [0.28, 0.05, 3.96, 0.88]
  hip_l: [-0.15, 0.00, 4.00, 0.93]
  hip_r: [0.15, 0.00, 4.00, 0.93]
  knee_l: [-0.16, 0.45, 4.00, 0.90]
  knee_r: [0.16, 0.45, 4.00, 0.90]
  ankle_l: [-0.17, 0.90, 4.00, 0.88]
  ankle_r: [0.17, 0.90, 4.00, 0.88]

keyframes:
  - t_s: 0.0
    all: [0.0, 0.0, 0.0, 0.0]

  # 0.75 m closer at 2.5 m/s, and the upper body has pitched forward: the
  # shoulders lead the hips by 0.23 m, which is ~25 deg over a 0.5 m torso.
  - t_s: 0.3
    all: [0.0, 0.0, -0.75, 0.0]
    offsets:
      shoulder_l: [0.0, 0.0, -0.23, 0.0]
      shoulder_r: [0.0, 0.0, -0.23, 0.0]
      elbow_l: [0.0, 0.0, -0.23, 0.0]
      elbow_r: [0.0, 0.0, -0.23, 0.0]
      wrist_l: [0.0, 0.0, -0.23, 0.0]
      wrist_r: [0.0, 0.0, -0.23, 0.0]

  # Still closing at 2.5 m/s, lean held.
  - t_s: 0.8
    all: [0.0, 0.0, -2.00, 0.0]
    offsets:
      shoulder_l: [0.0, 0.0, -0.23, 0.0]
      shoulder_r: [0.0, 0.0, -0.23, 0.0]
      elbow_l: [0.0, 0.0, -0.23, 0.0]
      elbow_r: [0.0, 0.0, -0.23, 0.0]
      wrist_l: [0.0, 0.0, -0.23, 0.0]
      wrist_r: [0.0, 0.0, -0.23, 0.0]
