# strike.yaml -- a single-arm punch from a chambered position.
#
# Hand-authored against the same thresholds it is checked with, so this
# passing is not a recall figure. See scenario.py.
#
# The body does not translate, so LUNGE stays at zero. Only the right arm
# moves, so the bilateral term in SHOVE stays at zero. This scenario is
# therefore also the discrimination check for both of those.

name: strike
description: Right-arm punch, chambered then extended, body stationary.
expect: confirm
rate_hz: 15.0

base:
  shoulder_l: [-0.20, -0.50, 4.00, 0.95]
  shoulder_r: [0.20, -0.50, 4.00, 0.95]
  elbow_l: [-0.25, -0.22, 3.98, 0.90]
  elbow_r: [0.25, -0.22, 3.98, 0.90]
  wrist_l: [-0.28, 0.05, 3.96, 0.88]
  wrist_r: [0.28, 0.05, 3.96, 0.88]
  hip_l: [-0.15, 0.00, 4.00, 0.93]
  hip_r: [0.15, 0.00, 4.00, 0.93]
  knee_l: [-0.16, 0.45, 4.00, 0.90]
  knee_r: [0.16, 0.45, 4.00, 0.90]
  ankle_l: [-0.17, 0.90, 4.00, 0.88]
  ankle_r: [0.17, 0.90, 4.00, 0.88]

keyframes:
  - t_s: 0.0
    all: [0.0, 0.0, 0.0, 0.0]

  # Chamber: right wrist drawn up and slightly behind the shoulder plane.
  # Shoulder-to-wrist distance collapses to ~0.12 m.
  - t_s: 0.2
    offsets:
      wrist_r: [0.02, -0.50, 0.09, 0.0]
      elbow_r: [0.05, -0.25, 0.06, 0.0]

  # Extension: 0.81 m of hand travel in 0.2 s (4.05 m/s), opening the
  # shoulder-to-wrist distance by 0.64 m (3.2 m/s).
  - t_s: 0.4
    offsets:
      wrist_r: [0.00, -0.50, -0.72, 0.0]
      elbow_r: [0.02, -0.28, -0.34, 0.0]

  # Held, so the window carries the peak long enough to confirm.
  - t_s: 1.0
    offsets:
      wrist_r: [0.00, -0.50, -0.72, 0.0]
      elbow_r: [0.02, -0.28, -0.34, 0.0]
