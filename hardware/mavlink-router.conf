# mavlink-router config for the Pi: fans the flight controller's one serial
# link out to every MAVLink client, the job MAVProxy's --out does in SITL.
# The UDP ports are the SITL ones, so mav_bridge and patrol run unchanged.
#
# Install as /etc/mavlink-router/main.conf (docs/HARDWARE.md, section 3).
# test_hw_config.py checks these ports against bridge.yaml and patrol.yaml.

[General]
TcpServerPort = 0
ReportStats = false

# Flight controller over USB (SERIAL0 on the H743, MAVLink by default, so no
# SERIALn parameters are needed). Replace CHANGE-ME with the real id from
#   ls /dev/serial/by-id/
# Never /dev/ttyACM0: it renumbers when anything else enumerates first.
[UartEndpoint fc]
Device = /dev/serial/by-id/usb-ArduPilot-CHANGE-ME-if00
Baud = 115200

# mav_bridge (bridge.yaml: udpin:0.0.0.0:14552)
[UdpEndpoint bridge]
Mode = Normal
Address = 127.0.0.1
Port = 14552

# patrol_node's own position-setpoint link (patrol.yaml: udpin:0.0.0.0:14553)
[UdpEndpoint patrol]
Mode = Normal
Address = 127.0.0.1
Port = 14553

# Local tools: preflight_hw.sh and hw_param_readback.py listen here.
[UdpEndpoint tools]
Mode = Normal
Address = 127.0.0.1
Port = 14554

# Ground station over Wi-Fi: point QGroundControl or MAVProxy at the Pi's
# address, UDP 14550. Server mode answers whoever connects.
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
