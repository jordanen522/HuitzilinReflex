name: tests

# The ROS-free half of the suite. Everything here imports only numpy, scipy,
# yaml or pymavlink, so it runs on a stock ubuntu runner with no ROS 2 and no
# colcon build.
#
# The module list is a DENY-LIST on purpose: collect both test/ directories,
# then subtract. An allow-list fails silently -- a module nobody lists simply
# never runs, and CI stays green while covering less than you think. A
# deny-list fails loudly: a new module that needs ROS breaks the run until it
# is named below.
#
# Not run here, and not an oversight:
#   test_evasion_params - imports evasion_node, which imports rclpy.
# test_clock_guard IS run: clock_guard imports rclpy.clock only inside
# install_clock_guard, and those tests skip themselves without it.
#
# huitzilin_action_escalation needs no exclusion either, and that is a
# property of how its tests are written rather than luck: the two
# invariant modules read node source as TEXT and parse it with ast, so
# they check the nodes without importing them. If a test here ever needs
# a live node, name it below rather than dropping the whole directory.
#
# Run the whole suite, that module included, on the Dell:
#   ./scripts/run_tests.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # matches Ubuntu 24.04 / ROS 2 Jazzy

      - name: Install the non-ROS dependencies
        run: pip install pytest numpy scipy pyyaml pymavlink

      - name: Run the ROS-free modules
        env:
          # The tests import huitzilin_sim / huitzilin_perception by package
          # name, which colcon normally arranges.
          PYTHONPATH: src/huitzilin_sim:src/huitzilin_perception:src/huitzilin_action_escalation
        run: |
          python -m pytest -q \
            src/huitzilin_sim/test \
            src/huitzilin_perception/test \
            src/huitzilin_action_escalation/test \
            --ignore=src/huitzilin_perception/test/test_evasion_params.py
