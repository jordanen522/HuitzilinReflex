name: tests

# The ROS-free half of the suite. Everything here imports only numpy, scipy,
# yaml or pymavlink, so it runs on a stock ubuntu runner with no ROS 2 and no
# colcon build.
#
# THIS IS A DENY-LIST ON PURPOSE -- collect both test/ directories, then
# subtract. It used to name all 14 ROS-free modules explicitly, and five new
# ones (test_oracle, test_mono_flash, test_cmd_router, test_setpoint_masks,
# test_projectile_model) were added to the tree without being added here, so
# they ran only on the Dell and never on push. An allow-list fails SILENTLY --
# a module nobody lists simply never runs, and CI stays green while covering
# less than you think. A deny-list fails LOUDLY: a new module that needs ROS
# breaks the run until it is named below, which is the error you want.
#
# NOT run here, and not an oversight:
#   test_evasion_params  - imports evasion_node, which imports rclpy.
# test_clock_guard IS run: clock_guard imports rclpy.clock only inside
# install_clock_guard, and those tests skip themselves without it.
#
# Run the whole suite, that module included, on the Dell:
#   ./scripts/run_tests.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # matches Ubuntu 24.04 / ROS 2 Jazzy

      - name: Install the non-ROS dependencies
        run: pip install pytest numpy scipy pyyaml pymavlink

      - name: Run the ROS-free modules
        env:
          # The tests import huitzilin_sim / huitzilin_perception by package
          # name, which colcon normally arranges.
          PYTHONPATH: src/huitzilin_sim:src/huitzilin_perception
        run: |
          python -m pytest -q \
            src/huitzilin_sim/test \
            src/huitzilin_perception/test \
            --ignore=src/huitzilin_perception/test/test_evasion_params.py
