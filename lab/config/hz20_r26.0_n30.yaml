# hz20_r26.0_n30.yaml — THE HEADLINE CLAIM, AT THREE TIMES THE SAMPLE SIZE.
#
# WHAT IS WRONG WITH THE CURRENT HEADLINE
#   "10/10 at 20 m/s from a 26 m sensor" is one cell of ten throws. A Wilson
#   95% interval on 10/10 has a LOWER BOUND OF 0.72 — the evidence is formally
#   consistent with a system that saves fewer than three throws in four. Two
#   more ceiling cells exist (10/10, 9/9) but they are different sessions, and
#   between-cell escape offset spans x0.68 to x1.36, so pooling them is not
#   free. 30 throws in ONE session has no such seam: 30/30 puts the lower bound
#   at 0.88, and 28/30 still leaves it at 0.79.
#
#   This does not test a new hypothesis. It is the confirmation run for the
#   claim the whole project rests on, and it is the cheapest large improvement
#   left in the evidence.
#
# THE SHIPPED dodge_speed_mps, DELIBERATELY
#   Run this at DODGE_SPEED=1.5, not the 3.0 most lab cells fly. The shipped
#   value already returned 10/10 at this range, and command magnitude plateaus
#   (escape goes as ~command^0.065), so 1.5 costs nothing and makes the result
#   a statement about the aircraft AS CONFIGURED rather than about a lab tune.
#
# PRE-REGISTERED, INCLUDING THE FAILURE MODE THAT IS SPECIFIC TO A LONG CELL
#   Expect >= 27/30. Below that, the single-cell ceilings were optimistic and
#   the reference config needs re-examining before any BOM claim rests on it.
#
#   30 consecutive throws is 3x longer than anything flown here, and a long
#   cell has a failure mode a short one does not: STATION DRIFT. A 2.0 s dodge
#   command once walked the aircraft to 4.63 m against the 5.0 m
#   escape_ceiling_m and then no-fired seven times in a row. At the shipped
#   1.0 s and 1.5 m/s the per-dodge displacement is far smaller, but it is not
#   zero and it accumulates.
#   SO: read the _alt.csv before reading the save count. If altitude drifts
#   monotonically, the last throws are not the same experiment as the first,
#   and the cell must be reported as two halves rather than as one rate.
#   Check the rep index of every failure — failures clustered in the last third
#   are drift, not envelope.
#
# Everything else is hz20_r26.0.yaml unchanged: hover, head-on, dead-centre,
# 60 Hz, stereo depth model, offset_forward_m 34.0. Score on the
# counterfactual (saved = counterfactual_min_m <= 0.30 AND actual > 0.30),
# never on `dodged`, and verify first_det_range_m ~= 26.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 30

runs:
  - id: H26
    description: "20 m/s head-on dead-centre, HOVER, oracle 26.0 m at 60 Hz, SHIPPED dodge_speed_mps 1.5 — n=30 confirmation of the headline claim"
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
