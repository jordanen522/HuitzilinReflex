# dspd30_r16.0.yaml - HOVER dodge-speed A/B, arm dodge_speed_mps = 3.0.
#
# Fixed oracle range 16 m at 14 m/s: tca lands ~0.8 s, straddling the measured
# save threshold, so the arm can move the outcome in either direction.
# Reference: dodge_speed 3.0 at this range scored 3 saved of 8 on course.
#
# THE QUESTION. Effective escape fits delta = 0.295*tca^3.15 (violently convex,
# almost nothing before 0.6 s). Dataflash shows achieved velocity change EXCEEDS
# commanded and the dodge only ever asks for ~1 m/s, so the curve may be
# COMMAND-limited, not airframe-limited. Jerk, tilt and WP_ACC are all refuted.
#
# The CLAUDE.md "dodge_speed 1.5->4.0 null" does NOT settle this: it was scored
# on patrol escape displacement (fit residual 0.0112 m against a 0.0391 m
# signal). This arm is scored on the counterfactual SAVE instead.
#
# RUN ALL THREE ARMS BACK TO BACK. Escape drifts up to 1.58x between nominally
# identical control arms, so only within-session comparison is valid. The 3.0
# arm is a repeat control, not a reuse of the earlier run.
#
# PRE-REGISTERED: monotonic rise in saves => command-limited, branch (a) alive.
# All three arms near 3/10 => the shipped 1.5 is already at the plateau, and
# sensor reach is the whole answer.
#
# SCORE ON THE COUNTERFACTUAL: saved = counterfactual <= 0.30 m AND actual > 0.30 m.
# detection_range_m is an INPUT, never a result.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: D30
    description: "14 m/s head-on dead-centre, HOVER, oracle range 16.0 m, dodge_speed_mps 3.0"
    speed_mps: 14.0
    offset_forward_m: 22.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
