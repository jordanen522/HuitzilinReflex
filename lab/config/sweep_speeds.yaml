# sweep_speeds.yaml — the same speeds, run once per oracle detection range.
#
# The outer loop (detection_range_m) lives in lab_sweep.sh, because the oracle
# reads detection_range_m ONCE in __init__ and has no parameter callback: a
# `ros2 param set` would report success and change nothing. Each range needs a
# fresh oracle_detector process.
#
# SPAWN OFFSET IS PER SPEED, ON PURPOSE. Two constraints fight:
#   * the ball must START OUTSIDE the range being swept, or the tracker is
#     handed a detection it never had to acquire and the range axis stops
#     meaning anything;
#   * the throw-window gate needs flight_time + 0.30 s of straight patrol leg,
#     and the 12 m loop only reliably supplies ~1.05 s, so flight time must
#     stay near 0.75 s.
# Offsets below hold flight time at 0.71-0.75 s while pushing the spawn as far
# out as each speed allows:
#     8 m/s  x 6 m  = 0.75 s   (B02 exactly -- comparable to the measured 78/78)
#    14 m/s  x 10 m = 0.71 s
#    20 m/s  x 15 m = 0.75 s   (B08 exactly)
#
# CONSEQUENCE, and it must be quoted with every result: effective range is
# min(detection_range_m, offset_forward_m). At range 12 the 8 m/s row is really
# a 6 m measurement. That costs nothing -- 8 m/s already succeeds at 3.4 m --
# but a 12 m number for S08 would be a lie about what was tested.
#
# week6_synthetic_battery.yaml cannot be reused here: its 14 and 8 m/s rows pin
# offset_forward_m to 6.0 so they reproduce B03/B02 exactly, which is right for
# a fidelity gate at one range and wrong for a sweep across many.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 3

runs:
  - id: S08
    description: "8 m/s head-on — B02 geometry; the working case must stay working"
    speed_mps: 8.0
    offset_forward_m: 6.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: S14
    description: "14 m/s head-on — the measured edge of the envelope"
    speed_mps: 14.0
    offset_forward_m: 10.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: S20
    description: "20 m/s head-on — the target case"
    speed_mps: 20.0
    offset_forward_m: 15.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: S20N
    description: "20 m/s wide miss 1.5 m — must NOT dodge; longer range buys more chance to fire wrongly"
    speed_mps: 20.0
    offset_forward_m: 15.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 2
