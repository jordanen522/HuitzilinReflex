# fd20_r26.0.yaml — FALSE DODGE at the reference 20 m/s configuration.
#
# THE ONLY CELL HERE THAT CAN FAIL THE PROJECT OUTRIGHT.
#
# Every save number measured so far is a TRUE-POSITIVE rate. The false-positive
# rate has been measured exactly once, at 8 m/s, 3.4 m of reach, under patrol:
# B07, 0/12. None of those three conditions holds any more. A 26 m sensor sees
# the ball 7.6x sooner, so it has 7.6x longer to decide wrongly, and it decides
# on a predicted miss distance extrapolated from a track that is youngest and
# worst-conditioned exactly when the ball is furthest away. An offline replay
# of this regime predicts ~18% false fires at 1.5 m. If that reproduces, the
# aircraft dodges on roughly one in five balls that were never going to hit it,
# and no 10/10 save rate compensates.
#
# HOVER, so the ball is where the harness says it is: under patrol the throw
# gate over-leads by 1.5-2.6 m, which would turn a designed 1.5 m miss into an
# arbitrary one and make the whole cell unreadable.
#
# SCORING IS INVERTED HERE. `saved` is meaningless — nothing is on a hit
# course by construction, and counterfactual_min_m should read >> 0.30 m on
# every row. The measurement is the FIRE COUNT: how many throws produced a
# dodge command at all. Read it from the battery's `dodged` column, which is
# the one place `dodged` is the right metric, and cross-check that
# counterfactual_min_m really is large — a row that comes back on-course means
# the geometry was wrong, not that the dodge was right.
#
# offset_forward_m 34.0 = detection_range_m + 8.0 at 26 m: the ball must be
# spawned OUTSIDE the sensor and fly in, or the cell measures a shorter sensor
# wearing a 26 m label. Verify first_det_range_m ~= 26 in the CSV.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true

runs:
  - id: F15
    description: "20 m/s, 1.5 m miss — outside threat radius, must NOT dodge. B07 geometry at 26 m."
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 0.0
    miss_distance_m: 1.5
    expect_dodge: false
    repeats: 10

  - id: F30
    description: "20 m/s, 3.0 m miss — far outside. A fire here is an unambiguous fault, not a tuning margin."
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 0.0
    miss_distance_m: 3.0
    expect_dodge: false
    repeats: 6

  - id: F05
    description: "20 m/s, 0.5 m miss — INSIDE the threat radius, must dodge. Bounds the discrimination the other two arms test."
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.5
    expect_dodge: true
    repeats: 6
