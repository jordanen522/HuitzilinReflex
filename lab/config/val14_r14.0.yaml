# val14_r14.0.yaml - ONE cell of the escape-curve validation. 14 m/s dead-centre.
#
# WHAT IS BEING TESTED. The escape curve measured by lab_dodgespeed.sh says
# displacement clears the 0.30 m hit radius at tca ~= 0.60 s when
# dodge_speed_mps = 3.0. That curve was fitted on PROBE throws; this asks
# whether it reproduces on BATTERY throws, and whether saves actually appear
# where it says they should.
#
# THE PREDICTION IS IN tca, NOT RANGE. Range is only the lever used to buy
# tca, and the closing speed (ball + cruise) is estimated, not known. Read
# "tca at dodge commit" out of the battery output and score against 0.60 s.
# Cells measuring tca < 0.60 s should save ~nothing; cells above should save.
# A cell that lands near 0.60 s is the threshold and is expected to be mixed.
#
# THIS FALSIFIES THE DELIVERABLE IF IT FAILS. The previous offline model
# predicted 78% at 14 m/s with a 12 m sensor and flew 0/6. If tca > 0.60 s
# cells still return 0 saves, the new range table (9.4 / 14.1 / 18.8 m) is
# wrong too and must not be reported.
#
# SCORE ON THE COUNTERFACTUAL, never on `dodged` or `success`. saved =
# counterfactual <= 0.30 m AND actual > 0.30 m. The harness has never
# delivered a ball inside 0.109 m, so every save here is still a graze
# conversion; that is a limit of the THROWER, and it is the same limit under
# which every earlier cell was scored, so the comparison holds.
#
# OFFSET. 21.0 = 14.0 + 7, satisfying the offset rule (range + ~6.2 m at
# 14 m/s: 0.27*14 ball travel + ~1.4 drone closure + ~1.0 one frame). Flight
# time is 21.0/14 s, so the throw window needs that plus 0.30 s of straight
# leg. Watch for SKIPPED throws - they are no data, never a failed dodge.
#
# detection_range_m is an INPUT. Nothing here is evidence such a sensor exists.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: V14
    description: "14 m/s head-on dead-centre at oracle range 14.0 m, dodge_speed_mps 3.0"
    speed_mps: 14.0
    offset_forward_m: 21.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
