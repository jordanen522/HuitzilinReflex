# ang_r26.0.yaml — WHAT ANGULAR SECTOR DOES THE PROPOSED CAMERA ACTUALLY DEFEND?
#
# Flown TWICE, once per oracle FOV, as the two cells of q3_fov.txt:
#   oracle_stereo.yaml        fov_half_angle_deg 45.0  — the harness default
#   oracle_stereo_fov13.yaml  fov_half_angle_deg 13.5  — the real 10 mm lens
#
# THE PROBLEM THIS EXISTS TO EXPOSE
#   Every 20 m/s save in this campaign was flown head-on (approach_angle_deg
#   0.0) through a +/-45 deg oracle. Both of those are harness defaults, not
#   properties of the camera being proposed. Reach and field of view are the
#   same optical trade: the 10 mm M12 that buys 0.300 mrad/px and 26 m of reach
#   also narrows the frustum to about +/-13.5 deg horizontally. A system that
#   only defends a 27 deg cone is a very different product from one that
#   defends 90 deg, and nothing flown so far distinguishes them.
#
# GEOMETRY
#   aim_at_drone: true, so the spawn ray AND the lateral-miss perpendicular use
#   (yaw + approach_angle_deg): the ball closes on the drone along that ray and
#   closest approach equals miss_distance_m regardless of angle
#   (ballistics.compute_spawn, the aim_at_drone branch). Two consequences:
#     * offset_forward_m is measured along the approach ray, so 34.0 gives the
#       same 26 m first detection at every angle — no per-arm adjustment;
#     * the ball sits at a CONSTANT bearing of approach_angle_deg off boresight
#       for the whole flight, which is exactly what makes this an FOV test
#       rather than a transient-visibility test.
#   With aim_at_drone FALSE this would silently become a crossing-trajectory
#   scenario missing by offset_forward_m*sin(angle) — 11.6 m at 20 deg. Do not
#   remove that key.
#
# HOVER, so the drone's yaw is fixed and the angle means what it says.
#
# PRE-REGISTERED PREDICTIONS
#   fov45 (control): A00, A10, A20 all save at roughly the head-on rate, 6-8/8
#   each. This arm establishes that oblique geometry ALONE does not break the
#   dodge.
#   fov13: A00 6-8/8. A10 6-8/8 (10 deg is inside 13.5). A20 ZERO FIRES — the
#   ball is never in view, so every throw should come back NO-FIRE with no
#   detections at all, not a failed dodge.
#
#   The informative outcomes are the surprises. If fov45/A20 also fails, the
#   limit is the oblique dodge and not the optics, which is a software problem
#   and a better one to have. If fov13/A20 fires at all, in_view is not doing
#   what the model says and the FOV number in the BOM is not trustworthy.
#
# READING THE RESULT
#   A20 under fov13 is expected to produce NO on-course FIRES, which is NOT
#   the same as 0/8 saves — nothing was ever detected, so the dodge was never
#   asked to do anything. Report it as "no detections, sector undefended", and
#   check first_det_range_m is empty/absent rather than 26.
#
# 8 repeats per arm rather than 10: three arms per cell, two cells, and the
# question here is a large qualitative effect (sees it or does not), not a
# small rate difference.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 8

runs:
  - id: A00
    description: "20 m/s head-on, 0 deg — the reference geometry, repeated inside this cell so the two FOV arms share a baseline"
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: A10
    description: "20 m/s at 10 deg off the nose — inside a 13.5 deg half-FOV, outside nothing"
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 10.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: A20
    description: "20 m/s at 20 deg off the nose — OUTSIDE a 13.5 deg half-FOV, inside a 45 deg one. The sector edge."
    speed_mps: 20.0
    offset_forward_m: 34.0
    approach_angle_deg: 20.0
    miss_distance_m: 0.0
    expect_dodge: true
