# hz20_r30.0.yaml — the reference 20 m/s hover geometry, moved out to 30 m.
#
# Exists for the mono-plus-reach question (lab/config/q11_mono_reach.txt): can
# one mono camera at 30 m match a calibrated stereo pair at 26 m? Nothing here
# is new except the range and the two distances that must follow it.
#
# offset_forward_m 40.0, NOT 34.0
#   The rule is offset_forward_m >= detection_range_m + 8.5 at 20 m/s. At the
#   old 34.0 a 30 m sensor would have the ball entering the gate from INSIDE
#   it, and the cell would silently measure a ~25 m sensor wearing a 30 m
#   label — exactly the fault that invalidated every pre-e1e77d3 12 m cell.
#   40.0 gives 10 m of clearance and a 2.0 s straight leg at 20 m/s.
#   VERIFY IT: first_det_range_m in the CSV must come back at ~30 m, within
#   about 0.5 m. The per-cell screen flags a shortfall over 1.0 m.
#
# TRIGGER HORIZON, which starts to matter at this range
#   should_dodge requires tca_s <= trigger_horizon_s (1.5 s). At 30 m and
#   20 m/s the earliest possible tca is 30/20 = 1.50 s, so the gate is right at
#   the edge and simply defers commit until tca falls to 1.5 s. That costs
#   nothing — 1.5 s is far above the 0.90 s the pooled fit needs — but it does
#   mean this cell CANNOT show a commit tca above 1.5 s no matter how good the
#   sensor is. Do not read that ceiling as a sensor property.
#   Any cell beyond ~33.6 m at 20 m/s would need trigger_horizon_s raised.
#
# Hover, head-on, dead-centre, so score on the counterfactual as always
# (saved = counterfactual_min_m <= 0.30 AND actual_min_m > 0.30), never on
# `dodged`.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: H30
    description: "20 m/s head-on dead-centre, HOVER, oracle 30.0 m at 60 Hz — the reach arm of the mono-vs-stereo BOM question"
    speed_mps: 20.0
    offset_forward_m: 40.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
