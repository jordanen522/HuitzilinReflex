# hz_ladder_r26.0.yaml — WHERE DOES THE 26 m SENSOR STOP DEFENDING?
#
# 24 m/s scored 9/10 at 26 m, so 20 m/s has margin. This finds the edge of it,
# and in doing so puts the pooled law at risk in the one region it has never
# been tested: above the design speed, where tca falls BELOW the knee.
#
# THE PREDICTION IS ARITHMETIC, NOT A GUESS
#   In hover, tca = range/speed - deadtime, with the MEASURED 60 Hz dead time
#   of 0.178 s. The pooled logistic over 125 on-course hover throws is
#   logit p = -21.11 + 26.05*tca, LD50 0.810 s (95% CI 0.783-0.842).
#
#     speed   tca at 26 m    P(save)     measured
#     20 m/s     1.122 s       0.99       10/10, 9/9, 10/10
#     24 m/s     0.905 s       0.92        9/10   <- already flown, matches
#     26 m/s     0.822 s       0.58
#     28 m/s     0.751 s       0.20
#     32 m/s     0.635 s       0.02
#
#   So the ladder walks straight down the steep face of the sigmoid. 26 m/s is
#   the coin flip; 28 m/s should mostly fail. Solving speed*(0.810+0.178) = 26
#   puts the 50% point at 26.3 m/s — that is the number this cell exists to
#   confirm or refute.
#
# WHY THIS IS A REAL TEST AND NOT A VICTORY LAP
#   A 10/10 at 28 m/s would refute the law outright and mean tca is not the
#   whole story after all. A 0/10 at 26 m/s would mean required tca RISES with
#   ball speed, contradicting the speed-independence result (LD50 0.797 s at
#   14 m/s vs 0.833 s at 20 m/s, bootstrap CI on the difference -0.041 to
#   +0.083 s). Either outcome is more valuable than the expected one.
#
# GEOMETRY
#   offset_forward_m rises with speed so the ball is unambiguously OUTSIDE the
#   sensor at spawn and flies in — the rule is >= detection_range_m + 8.5 at
#   20 m/s, and the margin has to grow with speed to keep the pre-detection
#   flight time above ~0.4 s. 38.0 at 26 m/s gives 0.46 s before first
#   detection; 40.0 at 28 m/s gives 0.50 s.
#   VERIFY first_det_range_m ~= 26 in the CSV for both. If it comes back short,
#   the cell measured a shorter sensor wearing a 26 m label and the result is
#   void — that failure has happened before.
#
#   min_launch_speed_frac is 0.85 in lab_cell.sh, so a throw leaving at less
#   than 22.1 / 23.8 m/s is rejected rather than scored as a slow NO-FIRE.
#   Note it is ONE-SIDED: a spuriously HIGH derived speed passes silently, so
#   read the reported ball-speed range and distrust any cell whose maximum is
#   far above spec.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: S26
    description: "26 m/s head-on dead-centre, HOVER, oracle 26.0 m at 60 Hz — the predicted coin flip (tca 0.822 s, P 0.58)"
    speed_mps: 26.0
    offset_forward_m: 38.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true

  - id: S28
    description: "28 m/s head-on dead-centre, HOVER, oracle 26.0 m at 60 Hz — below the knee (tca 0.751 s, P 0.20)"
    speed_mps: 28.0
    offset_forward_m: 40.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
