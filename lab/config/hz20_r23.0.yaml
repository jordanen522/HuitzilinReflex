# hz20_r23.0.yaml — 20 m/s at 23 m. HOW MUCH REACH IS ACTUALLY REQUIRED?
#
# 26 m is the first range that produced a clean sweep at 20 m/s, not the
# smallest one that would. The difference is money, mass and focal length:
# 26 m needs a 10 mm M12 (0.300 mrad/px); 23 m is inside what a 9 mm reaches,
# and each millimetre of focal length costs field of view the aircraft needs
# for coverage.
#
# WHAT IS ALREADY KNOWN at 20 m/s, hover, dodge_speed_mps 3.0:
#   21 m, 12 Hz, isotropic 0.15 m  -> 3/10
#   21 m, 60 Hz, isotropic 0.15 m  -> 5/10
#   26 m, 60 Hz, stereo 0.30/0.02  -> 10/10
#
# In hover tca = range/speed - deadtime, and at 60 Hz deadtime measured 0.177 s,
# so 23 m buys tca ~0.97 s against ~1.12 s at 26 m and ~0.87 s at 21 m. The
# pooled n=20 at 21 m says >= 0.90 s saves 4/5 and < 0.80 s saves 0/7, which
# puts 23 m in the band where the curve is steepest and least well measured.
# PREDICTION: 7-9 of 10. A 10/10 here retires 3 m of required reach; a 5/10
# says the 26 m cell was not carrying spare margin and the BOM must not shrink.
#
# Paired with hz20_r21.0.yaml and hz20_r26.0.yaml, this is a three-point range
# sweep at fixed rate and fixed noise — the first one in the campaign where
# only range moves.
#
# offset_forward_m 31.0 = range + 8.0, so the ball is spawned outside the
# sensor and flies in. Verify first_det_range_m ~= 23 in the CSV.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: H23
    description: "20 m/s head-on dead-centre, HOVER, oracle range 23.0 m at 60 Hz, dodge_speed_mps 3.0"
    speed_mps: 20.0
    offset_forward_m: 31.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
