# hz24_r26.0.yaml — 24 m/s at 26 m. DOES 20 m/s HAVE MARGIN, OR IS IT THE EDGE?
#
# The project's target is 20 m/s and 26 m delivered 10/10 there. That is a
# demonstration, not an envelope: an architecture that passes at exactly the
# target and falls over one step past it has no headroom for the things sim
# does not model (real detection jitter, wind, a ball that is not a perfect
# sphere, a drone that is not perfectly stationary).
#
# The law says required range = speed x (tca + deadtime). Holding 26 m and
# raising the speed spends the margin directly:
#   20 m/s -> tca 1.12 s   (measured 0.93-1.24, 10/10)
#   24 m/s -> tca 0.91 s
#   26 m/s -> tca 0.82 s   — at the threshold, should start failing
#
# So 24 m/s at 26 m is a test of the LAW as much as of the aircraft. If the
# threshold is real and speed-independent, 24 m/s should still mostly save
# (0.91 s sits in the band that scored 4/5 at 21 m) and 26 m/s should be
# marginal. PREDICTION: 6-9 of 10. A 10/10 would mean the escape term is
# better than the fit at high closing speed; a 0/10 would mean required tca
# grows with ball speed after all, which contradicts the 14-vs-20 m/s pairing
# and would be the most important negative result of the campaign.
#
# offset_forward_m 36.0 = range + 10.0: the extra 2 m over the 20 m/s cell
# keeps the pre-detection flight time above 0.4 s at the higher speed, so the
# ball is unambiguously outside the sensor at spawn. Verify first_det_range_m
# ~= 26 in the CSV.
#
# min_launch_speed_frac in lab_cell.sh is 0.85, so a throw that leaves at less
# than 20.4 m/s is rejected rather than scored as a 24 m/s NO-FIRE.

defaults:
  offset_vertical_m: 0.0
  compensate_gravity: true
  aim_at_drone: true
  repeats: 10

runs:
  - id: H24
    description: "24 m/s head-on dead-centre, HOVER, oracle range 26.0 m at 60 Hz, dodge_speed_mps 3.0"
    speed_mps: 24.0
    offset_forward_m: 36.0
    approach_angle_deg: 0.0
    miss_distance_m: 0.0
    expect_dodge: true
