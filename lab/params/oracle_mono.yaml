# oracle_mono.yaml — a SINGLE camera, depth from apparent size.
#
# Full copy of the shipped oracle_detector.yaml; see oracle_stereo.yaml for why
# it is a copy and not an overlay.
#
# WHAT IT MODELS
#   One AR0234-class mono global-shutter camera with a 10 mm M12, ranging by
#   the known-diameter prior R = D / (N * IFOV). Differentiating,
#   sigma_z = (z^2 * IFOV / D) * sigma_n — fractional range error equals
#   fractional diameter error and grows as z^2. At 26 m on an 80 mm ball the
#   blob is ~10 px and 0.3 px of edge noise is 0.85 m. Matching the stereo
#   model's 0.30 m would need 0.1 px; matching the old isotropic 0.15 m would
#   need 0.053 px, which is not achievable on a 10 px blob.
#
#   Bearing is unaffected — that is the whole point of the comparison. Only the
#   forward axis differs from oracle_stereo.yaml.
#
# 7/10 on-course saves at 20 m/s, 26 m, 60 Hz (hw26mono, commit 4021904), and
# the 3 failures were LATE COMMITS (tca 0.31/0.68/0.75 s) rather than weak
# escapes — the filter's R is hardcoded isotropic 0.15 m, so it over-trusts a
# 0.85 m measurement. Re-fly this file against the anisotropic-R build.

oracle_detector:
  ros__parameters:
    poses_topic: "/gz/dynamic_poses"
    odom_topic: "/huitzilin/odom"
    centroid_topic: "/threat/centroid"

    drone_model: "iris_depth"
    ball_name_prefixes: ["ball_", "projectile_"]

    detection_range_m: 26.0
    min_range_m: 0.30
    fov_half_angle_deg: 45.0
    rate_hz: 0.0

    noise_std_m: 0.15                    # inert: noise_std_xyz_m wins
    noise_std_xyz_m: [0.85, 0.02, 0.02]  # depth, cross-range, vertical

    dropout_prob: 0.0
    seed: 20260811

    stamp_offset_warn_s: 0.05
