# oracle_stereo_bear10.yaml — BEARING NOISE STRESSED TO AN IMPLAUSIBLE 0.10 m.
#
# Identical to oracle_stereo.yaml except the cross-range and vertical noise,
# which rise from 0.02 m to 0.10 m. Depth stays at the stereo 0.30 m.
#
# WHY THIS EXISTS
#   Every oracle in this campaign has carried cross-range 0.02 m, inherited
#   unexamined from the first stereo model. Bearing precision has therefore
#   never been swept, while depth has been swept hard (0.30 vs 0.85). That is
#   a gap in the BOM, because bearing error is not an optics constant — it is
#   a CALIBRATION and CENTROID spec, and it degrades with motion blur, partial
#   occlusion and a poorly fitted intrinsic model.
#
# WHY 0.10 m, WHICH IS DELIBERATELY TOO BAD
#   At 26 m and 0.300 mrad/px:
#       0.02 m =  2.6 px   the value flown everywhere so far
#       0.05 m =  6.4 px   a plausible bad day: blur plus soft calibration
#       0.10 m = 12.8 px   LARGER THAN THE BALL, which spans ~11 px at 26 m
#   0.10 m is not a realistic sensor. It is chosen so that ONE cell can close
#   the axis: if the envelope survives a bearing error bigger than the target
#   itself, bearing is not a spec driver and no further cells are owed. Only
#   if this fails does 0.05 m need flying to find the real boundary.
#
# WHAT A FAILURE WOULD MEAN
#   Cross-range error feeds the miss_m estimate directly, and miss_m <
#   threat_radius_m is the gate that holds the dodge. So bad bearing should
#   show up as a LATER commit (higher track_age, lower tca) rather than as a
#   wrong dodge direction. Read track_age_s and tca_s, not just the count.
#
# Noise is applied in base_link FLU, so "forward" is boresight depth and the
# other two axes are the bearing pair. Same caveat as oracle_stereo.yaml.

oracle_detector:
  ros__parameters:
    poses_topic: "/gz/dynamic_poses"
    odom_topic: "/huitzilin/odom"
    centroid_topic: "/threat/centroid"

    drone_model: "iris_depth"
    ball_name_prefixes: ["ball_", "projectile_"]

    # Overridden by the launch's detection_range_m argument — present only so
    # the file is a complete node configuration.
    detection_range_m: 26.0
    min_range_m: 0.30
    fov_half_angle_deg: 45.0

    # Overridden by the launch's oracle_rate_hz argument. 0.0 disables the
    # limiter and delivers Gazebo's full 60 Hz pose grid.
    rate_hz: 0.0

    noise_std_m: 0.15                    # inert: noise_std_xyz_m wins
    noise_std_xyz_m: [0.30, 0.10, 0.10]  # depth, cross-range, vertical

    dropout_prob: 0.0
    seed: 20260810             # fixed for audit; timing still varies run to run

    stamp_offset_warn_s: 0.05
