# oracle_stereo_fov13.yaml — the reference sensor model at its REAL field of view.
#
# Identical to oracle_stereo.yaml except fov_half_angle_deg, which drops from
# the harness default 45.0 to 13.5.
#
# WHY 13.5 DEGREES
#   Every 20 m/s result in the campaign was flown at +/-45 deg, which is a
#   property of the harness default, not of the camera being proposed. The
#   sensor that buys 26 m of reach does so with a 10 mm M12 lens, and the reach
#   and the field of view are the SAME optical trade — you cannot quote one
#   without the other.
#
#     AR0234 / OV2311 class, 3.0 um pitch, 1600 x 1300 active
#     sensor width  = 1600 * 3.0 um = 4.80 mm  -> half-angle atan(2.40/10) = 13.5 deg
#     sensor height = 1300 * 3.0 um = 3.90 mm  -> half-angle atan(1.95/10) = 11.0 deg
#
#   oracle.in_view models a symmetric CONE about boresight (oracle.py:110-123),
#   so a rectangular frustum has to be approximated by one half-angle. 13.5 deg
#   is the horizontal figure, which is the right one for a ball approaching in
#   the horizontal plane — the case the angle sweep actually flies. It is
#   OPTIMISTIC for a ball arriving high or low, where the true limit is 11.0
#   deg, and a cone at 13.5 deg claims coverage in the corners that the sensor
#   does not have. Do not quote this file as a vertical-coverage result.
#
# WHAT IT IS FOR
#   Paired against oracle_stereo.yaml over the same three approach angles
#   (lab/config/ang_r26.0.yaml), this separates "the dodge fails off-axis" from
#   "the camera cannot see off-axis". Those have completely different fixes:
#   the first is software, the second is a second camera.
#
#   The noise model carries the same caveat as oracle_stereo.yaml, and it
#   matters MORE here: noise is applied in base_link FLU, so "forward" is
#   boresight depth. For a 20 deg off-axis throw the true error ellipse follows
#   the line of sight, not the body x-axis. At 13.5 deg the misalignment is
#   inside the FOV edge and the depth/bearing split is smeared by cos(13.5) =
#   0.97 / sin(13.5) = 0.23 — small, but say so in any off-axis result.

oracle_detector:
  ros__parameters:
    poses_topic: "/gz/dynamic_poses"
    odom_topic: "/huitzilin/odom"
    centroid_topic: "/threat/centroid"

    drone_model: "iris_depth"
    ball_name_prefixes: ["ball_", "projectile_"]

    # Overridden by the launch's detection_range_m argument — present only so
    # the file is a complete node configuration.
    detection_range_m: 26.0
    min_range_m: 0.30
    fov_half_angle_deg: 13.5    # THE ONE CHANGE vs oracle_stereo.yaml

    # Overridden by the launch's oracle_rate_hz argument. 0.0 disables the
    # limiter and delivers Gazebo's full 60 Hz pose grid.
    rate_hz: 0.0

    noise_std_m: 0.15                    # inert: noise_std_xyz_m wins
    noise_std_xyz_m: [0.30, 0.02, 0.02]  # depth, cross-range, vertical

    dropout_prob: 0.0
    seed: 20260810             # fixed for audit; timing still varies run to run

    stamp_offset_warn_s: 0.05
