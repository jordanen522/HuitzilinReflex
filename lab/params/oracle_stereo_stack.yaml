# oracle_stereo_stack.yaml — THE AS-BUILT SENSOR, EVERY SPEC AT ITS BAD END AT ONCE.
#
# WHY THIS FILE EXISTS
#   Every cell in this campaign is ONE-FACTOR-AT-A-TIME. Depth was swept alone
#   (0.30 vs 0.85), rate alone (12 vs 60 Hz), latency alone (0/30/60 ms), field
#   of view alone (45 vs 13.5 deg), bearing not at all until bear10. Real
#   hardware does not degrade one axis at a time — it arrives with all of them
#   slightly worse than the datasheet, simultaneously, and the interactions are
#   exactly what a one-factor sweep cannot see.
#
#   This is therefore not a lever test. It is a PRODUCT ACCEPTANCE cell: the
#   proposed BOM, at the proposed operating point, with every modelled term set
#   to the pessimistic end of what the hardware is likely to deliver.
#
# WHAT IS STACKED, AND WHY EACH VALUE
#   fov_half_angle_deg 13.5  the REAL 10 mm M12 cone, not the 45 deg harness
#                            default. fov13 showed 20 deg off-axis is simply
#                            undefended, so head-on is the honest operating
#                            assumption and this cell flies it head-on.
#   depth      0.30 m        the modelled stereo pair, unchanged.
#   bearing    0.05 m        6.4 px at 26 m and 0.300 mrad/px: a plausible bad
#                            day of motion blur plus soft intrinsics, NOT the
#                            deliberately absurd 0.10 m of bear10.
#   Set by the queue line, not here:
#   ORACLE_DELAY 0.030 s     a real exposure->centroid pipeline.
#   DODGE_SPEED  1.5         the SHIPPED command, not the 3.0 lab tune, so the
#                            result is a statement about the aircraft as
#                            configured.
#   rate 60 Hz, range 26 m, speed 20 m/s: the reference design point.
#
# PRE-REGISTERED
#   The single-factor cells predict this survives: 26 m at 20 m/s commits near
#   tca 1.12 s, which is 0.31 s clear of the 0.810 s LD50, and no individual
#   degradation above is worth anything like 0.31 s. Expect >= 8/10.
#   A result BELOW 8/10 is the interesting one — it would mean the degradations
#   compound rather than add, and every single-factor conclusion in the
#   campaign would need re-reading with that in mind. Check track_age_s first:
#   compounding should appear as a later commit, not as a worse dodge.
#
# Noise is applied in base_link FLU. Same caveat as oracle_stereo.yaml.

oracle_detector:
  ros__parameters:
    poses_topic: "/gz/dynamic_poses"
    odom_topic: "/huitzilin/odom"
    centroid_topic: "/threat/centroid"

    drone_model: "iris_depth"
    ball_name_prefixes: ["ball_", "projectile_"]

    # Overridden by the launch's detection_range_m argument — present only so
    # the file is a complete node configuration.
    detection_range_m: 26.0
    min_range_m: 0.30
    fov_half_angle_deg: 13.5   # the real 10 mm M12 cone

    # Overridden by the launch's oracle_rate_hz argument. 0.0 disables the
    # limiter and delivers Gazebo's full 60 Hz pose grid.
    rate_hz: 0.0

    noise_std_m: 0.15                    # inert: noise_std_xyz_m wins
    noise_std_xyz_m: [0.30, 0.05, 0.05]  # depth, cross-range, vertical

    dropout_prob: 0.0
    seed: 20260810             # fixed for audit; timing still varies run to run

    stamp_offset_warn_s: 0.05
